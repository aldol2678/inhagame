name: Set up World browser QA
description: >-
  Shared setup for World browser QA jobs: pinned Node with the npm download cache,
  pinned browser-test dependencies, then an optional Playwright browser and Korean glyphs.
  The caller checks the repository out first; a local action cannot be resolved before that.
inputs:
  node-version:
    description: Node.js version. Pinned for every World QA job.
    required: false
    default: '24.19.0'
  playwright-browser:
    description: Playwright browser to install (chromium, webkit). Empty skips the install.
    required: false
    default: ''
  playwright-install-args:
    description: Flags placed before the browser name in `playwright install`.
    required: false
    default: '--with-deps'
  korean-fonts:
    description: Install fonts-noto-cjk so Korean text renders in screenshots.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: apps/world/tests/browser/package-lock.json
    - name: Install pinned browser dependencies
      shell: bash
      working-directory: apps/world/tests/browser
      run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Install Playwright browser
      if: inputs.playwright-browser != ''
      shell: bash
      working-directory: apps/world/tests/browser
      env:
        PLAYWRIGHT_BROWSER: ${{ inputs.playwright-browser }}
        PLAYWRIGHT_INSTALL_ARGS: ${{ inputs.playwright-install-args }}
      run: |
        # shellcheck disable=SC2086 -- install args are a caller-supplied flag list
        npx --no-install playwright install $PLAYWRIGHT_INSTALL_ARGS "$PLAYWRIGHT_BROWSER"
    - name: Install Korean glyphs
      if: inputs.korean-fonts == 'true'
      shell: bash
      env:
        APT_INDEX_FRESH: ${{ inputs.playwright-browser != '' && contains(inputs.playwright-install-args, '--with-deps') }}
      run: |
        # `playwright install --with-deps` already refreshed the apt index.
        if [[ "$APT_INDEX_FRESH" != "true" ]]; then sudo apt-get update -qq; fi
        sudo apt-get install -y fonts-noto-cjk
