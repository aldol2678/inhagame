name: Graphics integration browser QA
on:
  pull_request:
    paths:
      - 'apps/world/src/main.js'
      - 'apps/world/src/campus-contact-shading*.js'
      - 'apps/world/src/campus-chunk-renderer.js'
      - 'apps/world/src/graphics-presets.js'
      - 'apps/world/src/view-distance-settings.js'
      - 'apps/world/src/environment/**'
      - 'apps/world/src/biryong/**'
      - 'apps/world/campus/index.html'
      - 'apps/world/styles.css'
      - 'apps/world/tests/browser/graphics-parallel-smoke.mjs'
      - 'apps/world/tests/browser/biryong-night-pixel-policy.mjs'
      - 'apps/world/tests/biryong-night-readability.test.mjs'
      - 'apps/world/tests/browser/harness.mjs'
      - 'apps/world/tests/browser/harness-cleanup.mjs'
      - 'apps/world/tests/browser/graphics-failure-artifact.mjs'
      - 'apps/world/tests/graphics-failure-artifact.test.mjs'
      - 'apps/world/tests/browser-harness-cleanup.test.mjs'
      - 'apps/world/tests/browser/package*.json'
      - 'apps/world/tests/graphics-parallel-smoke-contract.test.mjs'
      - '.github/workflows/graphics-integration-browser.yml'
permissions:
  contents: read
concurrency:
  group: graphics-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install pinned browser dependencies
        working-directory: apps/world/tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and Korean glyphs
        run: |
          cd apps/world/tests/browser
          npx --no-install playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Verify graphics integration contracts
        run: node --test apps/world/tests/graphics-parallel-smoke-contract.test.mjs apps/world/tests/graphics-failure-artifact.test.mjs apps/world/tests/browser-harness-cleanup.test.mjs
      - name: Run integrated graphics browser smoke
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          EXPECTED_GRAPHICS_HEAD: ${{ github.event.pull_request.head.sha }}
          WORLD_GRAPHICS_QA_OUTPUT: test-results/graphics-parallel
        run: node apps/world/tests/browser/graphics-parallel-smoke.mjs
      - name: Preserve exact-head browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-graphics-integration-${{ github.event.pull_request.head.sha }}
          path: test-results/graphics-parallel/
          if-no-files-found: error
          retention-days: 7
