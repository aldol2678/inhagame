name: ALDOL 3D Studio P2.1 GLB Rendering
on:
  pull_request:
    paths:
      - tools/aldol-3d-studio-p1/**
      - .github/workflows/aldol-3d-studio-p2-1.yml
permissions:
  contents: read
concurrency:
  group: studio-p21-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verified-glb-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Exact source revision
        run: git rev-parse HEAD
      - name: Studio syntax, unit and archive security
        working-directory: tools/aldol-3d-studio-p1
        run: |
          npm run check
          npm test
      - name: Existing real editor and Factory roundtrip
        working-directory: tools/aldol-3d-studio-p1
        env:
          INHA_WORLD_EDITOR_DIR: ${{ github.workspace }}/apps/world/src/editor
        run: |
          npm run test:real
          node --test tests/factory-real-p2.mjs
      - name: Existing pinned engine and browser dependencies
        working-directory: apps/world/tests/browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Real GLB mesh, material, texture, ZIP fresh session and mobile browser
        run: |
          mkdir -p test-results/aldol-studio-p2-1
          set -o pipefail
          node tools/aldol-3d-studio-p1/tests/browser-glb-p21.mjs 2>&1 | tee test-results/aldol-studio-p2-1/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aldol-studio-p21-${{ github.event.pull_request.head.sha }}
          path: test-results/aldol-studio-p2-1/
          if-no-files-found: error
          retention-days: 30
