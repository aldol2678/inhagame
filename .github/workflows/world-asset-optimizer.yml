name: World asset optimizer

on:
  pull_request:
    paths:
      - 'tools/world-assets/**'
      - 'apps/world/assets/*.glb'
      - 'apps/world/src/asset-optimization-shadow.js'
      - 'apps/world/src/asset-authority-canary.js'
      - 'apps/world/src/asset-production-canary.js'
      - 'apps/world/src/asset-canary-remote-control.js'
      - 'apps/world/src/asset-canary-telemetry.js'
      - 'apps/world/api/asset-canary-flag.js'
      - 'apps/world/api/hub-event.js'
      - 'apps/world/api/brand-asset.js'
      - 'apps/world/vercel.json'
      - 'apps/world/tests/brand-asset-routing.test.mjs'
      - 'supabase/functions/inhagame-world-brand-assets-optimized-v1/**'
      - 'apps/world/src/character-model.js'
      - 'apps/world/src/main.js'
      - 'apps/world/src/campus-render-kit.js'
      - 'apps/world/src/campus-material-profile.js'
      - 'apps/world/tests/campus-material-profile.test.mjs'
      - 'apps/world/tests/browser/material-profile-smoke.mjs'
      - 'apps/world/src/lobby/lobby-loading.js'
      - 'apps/world/tests/browser/loading-render-smoke.mjs'
      - 'apps/world/tests/browser/harness.mjs'
      - 'apps/world/src/campus-road-geometry.js'
      - 'apps/world/src/campus-road-micro-details.js'
      - 'apps/world/src/campus-contact-shading*.js'
      - 'apps/world/src/campus-chunk-renderer.js'
      - 'apps/world/tests/campus-contact-shading.test.mjs'
      - 'apps/world/tests/browser/contact-shading-smoke.mjs'
      - 'apps/world/src/graphics-presets.js'
      - 'apps/world/src/view-distance-settings.js'
      - 'apps/world/src/environment/environment-director.js'
      - 'apps/world/src/environment/environment-presets.js'
      - 'apps/world/src/environment/environment-world-time.js'
      - 'apps/world/tests/browser/graphics-parallel-smoke.mjs'
      - 'apps/world/tests/graphics-parallel-smoke-contract.test.mjs'
      - 'apps/world/tests/campus-road-micro-details.test.mjs'
      - 'apps/world/src/environment/winter-soak-policy.js'
      - 'apps/world/tests/environment-p6l-winter-soak.test.mjs'
      - 'apps/world/tests/browser/winter-soak-smoke.mjs'
      - 'apps/world/src/biryong/biryong-performance-budget.js'
      - 'apps/world/src/biryong/biryong-performance-monitor.js'
      - 'apps/world/tests/biryong-performance-budget.test.mjs'
      - 'apps/world/tests/browser/biryong-performance-smoke.mjs'
      - 'apps/world/tests/browser/biryong-performance-diagnostics.mjs'
      - 'apps/world/tests/biryong-performance-smoke-diagnostics.test.mjs'
      - 'apps/world/tests/asset-optimization-shadow.test.mjs'
      - 'apps/world/tests/asset-authority-canary.test.mjs'
      - 'apps/world/tests/asset-production-canary.test.mjs'
      - 'apps/world/tests/asset-canary-flag-api.test.mjs'
      - 'apps/world/tests/asset-canary-remote-control.test.mjs'
      - 'apps/world/tests/browser/asset-optimization-shadow-*'
      - 'apps/world/tests/browser/asset-authority-canary-*'
      - 'apps/world/tests/browser/asset-production-canary-*'
      - 'apps/world/tests/browser/asset-canary-remote-kill-*'
      - 'supabase/migrations/*asset_canary*'
      - 'supabase/tests/database/91_world_asset_canary_remote_control.test.sql'
      - '.github/workflows/world-asset-optimizer.yml'

permissions:
  contents: read

concurrency:
  group: world-asset-optimizer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Safety checks are independent of the renderer performance budget. A failure
  # in one smoke still lets the other two report; setup failure skips all three.
  canary-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact safety source revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$EXPECTED_HEAD"
          echo "Canary safety source: $actual_head"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: tools/world-assets/package-lock.json
      - name: Install locked optimizer dependencies
        working-directory: tools/world-assets
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate shadow-consumer assets
        working-directory: tools/world-assets
        run: npm run verify
      - name: Install World browser smoke dependencies
        id: prepare
        working-directory: apps/world/tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run asset authority canary smoke
        id: authority
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          WORLD_SMOKE_BROWSER: chrome
        run: node apps/world/tests/browser/asset-authority-canary-smoke.mjs
      - name: Run full-cohort production asset rollout smoke
        id: production
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          WORLD_SMOKE_BROWSER: chrome
        run: node apps/world/tests/browser/asset-production-canary-smoke.mjs
      - name: Run remote asset canary kill-switch smoke
        id: remote-kill
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          WORLD_SMOKE_BROWSER: chrome
        run: node apps/world/tests/browser/asset-canary-remote-kill-smoke.mjs

  verify:
    # Keep the existing required context and fail closed on every safety result.
    needs: [canary-safety]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: tools/world-assets/package-lock.json
      - name: Install locked optimizer dependencies
        working-directory: tools/world-assets
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run optimizer contract tests
        working-directory: tools/world-assets
        run: npm test
      - name: Run strict optimizer verification
        working-directory: tools/world-assets
        run: npm run verify -- --output-root "$RUNNER_TEMP/inhagame-world-assets"
      - name: Generate shadow-consumer assets
        working-directory: tools/world-assets
        run: npm run verify
      - name: Install World browser smoke dependencies
        working-directory: apps/world/tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run asset optimization shadow smoke
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          WORLD_SMOKE_BROWSER: chrome
        run: node apps/world/tests/browser/asset-optimization-shadow-smoke.mjs
      - name: Run campus material profile smoke
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          WORLD_SMOKE_BROWSER: chrome
        run: node apps/world/tests/browser/material-profile-smoke.mjs
      - name: Run delayed-character loading render smoke
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          WORLD_SMOKE_BROWSER: chrome
        run: node apps/world/tests/browser/loading-render-smoke.mjs
      - name: Run winter environment soak smoke
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          WORLD_SMOKE_BROWSER: chrome
        run: node apps/world/tests/browser/winter-soak-smoke.mjs
      - name: Run campus contact shading smoke
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          WORLD_SMOKE_BROWSER: chrome
        run: node apps/world/tests/browser/contact-shading-smoke.mjs
      - name: Run Biryong visual performance smoke
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          WORLD_SMOKE_BROWSER: chrome
          BIRYONG_PERF_RECEIPT: ${{ runner.temp }}/biryong-visual-performance.json
        run: node apps/world/tests/browser/biryong-performance-smoke.mjs
      - name: Preserve Biryong performance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biryong-performance-diagnostics-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/biryong-visual-performance.json
          if-no-files-found: warn
          retention-days: 7
      - name: Verify production optimized brand route contracts
        run: node --test apps/world/tests/brand-asset-routing.test.mjs
      - name: Upload optimizer metadata-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: world-asset-optimizer-evidence
          path: |
            ${{ runner.temp }}/inhagame-world-assets/optimization-report.json
            ${{ runner.temp }}/biryong-visual-performance.json
          if-no-files-found: error
          retention-days: 7
      - name: Require independent canary safety success
        if: always()
        env:
          SAFETY_RESULT: ${{ needs.canary-safety.result }}
        run: |
          if [ "$SAFETY_RESULT" != success ]; then
            echo "Independent canary safety did not succeed: $SAFETY_RESULT"
            exit 1
          fi
