name: Biryong cloud-save recovery browser QA
on:
  pull_request:
    paths:
      - 'apps/world/src/biryong/biryong-cloud-*.js'
      - 'apps/world/src/biryong/biryong-system.js'
      - 'apps/world/src/biryong/biryong-state.js'
      - 'apps/world/src/main.js'
      - 'apps/world/styles.css'
      - 'apps/world/tests/biryong-cloud-*.test.mjs'
      - 'apps/world/tests/browser/biryong-cloud-sync-*'
      - 'apps/world/tests/browser/package*.json'
      - '.github/workflows/biryong-cloud-sync-browser.yml'
permissions:
  contents: read
concurrency:
  group: biryong-cloud-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install pinned browser dependencies
        working-directory: apps/world/tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and Korean glyphs
        run: |
          cd apps/world/tests/browser
          npx --no-install playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify cloud recovery and status contracts
        run: node --test apps/world/tests/biryong-cloud-*.test.mjs
      - name: Exercise keyboard and touch with synthetic RPCs only
        env:
          BIRYONG_CLOUD_SYNC_HEAD: ${{ github.event.pull_request.head.sha }}
          BIRYONG_CLOUD_SYNC_OUTPUT: test-results/biryong-cloud-sync
        run: node apps/world/tests/browser/biryong-cloud-sync-smoke.mjs
      - name: Preserve exact-head screenshots and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biryong-cloud-sync-browser-evidence
          path: test-results/biryong-cloud-sync/
          if-no-files-found: error
          retention-days: 14
