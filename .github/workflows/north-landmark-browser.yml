name: North landmarks and Agora browser QA
on:
  pull_request:
    paths:
      - 'apps/world/src/north-*'
      - 'apps/world/src/agora-photo-geometry.js'
      - 'apps/world/src/campus-facilities.js'
      - 'apps/world/src/campus-material-profile.js'
      - 'apps/world/src/facility-blockout.js'
      - 'apps/world/src/roadview-details.js'
      - 'apps/world/data/reality/north-landmark-restoration.provenance.json'
      - 'apps/world/tests/*north-landmark*'
      - 'apps/world/tests/browser/north-landmark-*'
      - '.github/workflows/north-landmark-browser.yml'
permissions:
  contents: read
concurrency:
  group: north-landmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install pinned browser test dependencies
        run: npm ci --prefix apps/world/tests/browser --ignore-scripts --no-audit --no-fund
      - name: Verify geometry and original gameplay contracts
        run: node --test apps/world/tests/north-landmark-restoration.test.mjs apps/world/tests/north-campus.test.mjs apps/world/tests/roadview-details.test.mjs apps/world/tests/campus-facilities.test.mjs apps/world/tests/student-center-campus.test.mjs
      - name: Verify real engine ownership
        run: |
          node apps/world/tests/browser/north-landmark-null-smoke.mjs
          node apps/world/tests/browser/hall-library-integration-null-smoke.mjs
      - name: Capture pinned original public presentation
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          WORLD_SMOKE_BROWSER: chrome
        run: |
          baseline=9fa74a0b69c85e3a4ba57ceba38fb0d28019706b
          git worktree add --detach /tmp/north-landmark-before "$baseline"
          cp apps/world/tests/browser/north-landmark-smoke.mjs /tmp/north-landmark-before/apps/world/tests/browser/
          ln -s "$PWD/apps/world/tests/browser/node_modules" /tmp/north-landmark-before/apps/world/tests/browser/node_modules
          output="$PWD/test-results/north-landmarks/before"
          (cd /tmp/north-landmark-before && NORTH_LANDMARK_MODE=baseline EXPECTED_NORTH_HEAD="$baseline" NORTH_LANDMARK_OUTPUT="$output" node apps/world/tests/browser/north-landmark-smoke.mjs)
      - name: Capture exact-head candidate with identical cameras
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          WORLD_SMOKE_BROWSER: chrome
          NORTH_LANDMARK_OUTPUT: test-results/north-landmarks/after
          EXPECTED_NORTH_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node apps/world/tests/browser/north-landmark-smoke.mjs
      - name: Save same-camera before and after evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: north-landmark-browser-evidence
          path: test-results/north-landmarks/
          if-no-files-found: error
          retention-days: 7
