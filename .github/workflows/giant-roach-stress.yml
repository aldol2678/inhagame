name: Giant roach isolated stress QA
on:
  pull_request:
    paths:
      - 'apps/world/src/giant-roach-experiment.js'
      - 'apps/world/src/main.js'
      - 'apps/world/tests/giant-roach-experiment.test.mjs'
      - 'apps/world/tests/browser/giant-roach-stress-smoke.mjs'
      - '.github/workflows/giant-roach-stress.yml'
permissions:
  contents: read
concurrency:
  group: giant-roach-stress-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install existing pinned browser dependencies
        working-directory: apps/world/tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify isolation contracts
        run: node --test apps/world/tests/giant-roach-experiment.test.mjs
      - name: Measure 10 30 50 100 under one reproducible browser session
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          WORLD_SMOKE_BROWSER: chrome
          WORLD_ROACH_QA_OUTPUT: test-results/giant-roach
        run: node apps/world/tests/browser/giant-roach-stress-smoke.mjs
      - name: Save metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: giant-roach-stress-metrics
          path: test-results/giant-roach/
          if-no-files-found: error
          retention-days: 7
