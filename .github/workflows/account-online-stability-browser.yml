name: Account and online stability browser QA
on:
  pull_request:
    paths:
      - 'apps/world/src/main.js'
      - 'apps/world/src/social/**'
      - 'apps/world/src/online/**'
      - 'apps/world/src/lobby/lobby-presence-summary.js'
      - 'apps/world/styles.css'
      - 'apps/world/tests/browser/account-online-stability-smoke.mjs'
      - 'apps/world/tests/browser/harness*.mjs'
      - 'apps/world/tests/social-account-isolation.test.mjs'
      - 'apps/world/tests/social-account-session.test.mjs'
      - 'apps/world/tests/friend-panel-visit-lifecycle.test.mjs'
      - 'apps/world/tests/chat-account-draft.test.mjs'
      - 'apps/world/tests/online-lifecycle-regression.test.mjs'
      - 'apps/world/tests/lobby-presence-unknown.test.mjs'
      - '.github/workflows/account-online-stability-browser.yml'
permissions:
  contents: read
concurrency:
  group: account-online-stability-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  account-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install pinned browser harness
        working-directory: apps/world/tests/browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Account isolation and online lifecycle
        run: |
          node --test apps/world/tests/social-account-isolation.test.mjs apps/world/tests/social-account-session.test.mjs apps/world/tests/friend-panel-visit-lifecycle.test.mjs apps/world/tests/chat-account-draft.test.mjs apps/world/tests/online-lifecycle-regression.test.mjs apps/world/tests/lobby-presence-unknown.test.mjs
      - name: Production DOM modules with synthetic Auth and RPC
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
        run: node apps/world/tests/browser/account-online-stability-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-online-stability-screenshots
          path: test-results/account-online-stability/
          if-no-files-found: warn
          retention-days: 7
