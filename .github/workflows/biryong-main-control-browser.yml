name: Biryong immutable main control

on:
  pull_request:
    paths:
      - 'apps/world/**'
      - '.github/workflows/biryong-main-control-browser.yml'
      - '.github/ci/biryong-ci-scope.mjs'
      - '.github/ci/biryong-ci-scope.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-low-off:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONTROL_SHA: e49419c39d884515f2402a2f3a23fe4c754b8882
      WORLD_SMOKE_DISABLE_WEBGPU: '1'
      WORLD_SMOKE_BROWSER: chrome
      BIRYONG_PERF_MODE: baseline-only
      BIRYONG_PERF_TIERS: low
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Test fail-closed Biryong scope
        run: node --test .github/ci/biryong-ci-scope.test.mjs
      - name: Fetch exact PR base for scope
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          # If unavailable, the classifier fails closed to full measurement.
          if [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            git fetch --quiet --no-tags --depth=1 origin "$PR_BASE_SHA" || true
          fi
      - name: Detect Biryong benchmark scope
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/ci/biryong-ci-scope.mjs >> "$GITHUB_OUTPUT"
      - name: Record verified UI-asset-only scope
        if: steps.scope.outputs.mode == 'asset_only'
        shell: bash
        run: |
          echo "UI icon asset-only change: Biryong benchmark not affected; compare-low-off passed scope gate." >> "$GITHUB_STEP_SUMMARY"
          echo "Only apps/world/assets/ui-icons/p0-v1/svg/*.svg, README.md and manifest.json qualify." >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout immutable main control
        if: steps.scope.outputs.mode == 'measure'
        uses: actions/checkout@v4
        with:
          ref: e49419c39d884515f2402a2f3a23fe4c754b8882
          path: .qa-control-main
          persist-credentials: false
      - name: Verify source identity and prepare receipts
        if: steps.scope.outputs.mode == 'measure'
        id: sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .qa-control-main rev-parse HEAD)" = "$CONTROL_SHA"
          echo "QA_CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "QA_CANDIDATE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          echo "QA_CONTROL_TREE=$(git -C .qa-control-main rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/biryong-main-control"
      - name: Install same pinned sampler engine
        if: steps.scope.outputs.mode == 'measure'
        id: dependencies
        working-directory: apps/world/tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Measure immutable main LOW Visual OFF
        if: steps.scope.outputs.mode == 'measure'
        id: main
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          GITHUB_SHA="$QA_CANDIDATE_SHA" \
          BIRYONG_PERF_SOURCE_SHA="$CONTROL_SHA" \
          BIRYONG_PERF_SOURCE_TREE="$QA_CONTROL_TREE" \
          BIRYONG_PERF_WORLD_ROOT="$GITHUB_WORKSPACE/.qa-control-main/apps/world" \
          BIRYONG_PERF_RECEIPT="$RUNNER_TEMP/biryong-main-control/main.json" \
          node apps/world/tests/browser/biryong-performance-smoke.mjs 2>&1 | tee "$RUNNER_TEMP/biryong-main-control/main.log"
      - name: Measure candidate LOW Visual OFF
        id: candidate
        if: always() && steps.scope.outputs.mode == 'measure' && steps.dependencies.outcome == 'success' && steps.sources.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          GITHUB_SHA="$QA_CANDIDATE_SHA" \
          BIRYONG_PERF_SOURCE_SHA="$QA_CANDIDATE_SHA" \
          BIRYONG_PERF_SOURCE_TREE="$QA_CANDIDATE_TREE" \
          BIRYONG_PERF_WORLD_ROOT="$GITHUB_WORKSPACE/apps/world" \
          BIRYONG_PERF_RECEIPT="$RUNNER_TEMP/biryong-main-control/candidate.json" \
          node apps/world/tests/browser/biryong-performance-smoke.mjs 2>&1 | tee "$RUNNER_TEMP/biryong-main-control/candidate.log"
      - name: Compare same-runner LOW controls without relaxing budgets
        if: always() && steps.scope.outputs.mode == 'measure'
        env:
          BIRYONG_CONTROL_MAIN_OUTCOME: ${{ steps.main.outcome }}
          BIRYONG_CONTROL_CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
        shell: bash
        run: |
          node apps/world/tests/browser/biryong-control-report.mjs \
            "$RUNNER_TEMP/biryong-main-control/main.json" \
            "$RUNNER_TEMP/biryong-main-control/candidate.json" \
            "$RUNNER_TEMP/biryong-main-control/comparison.json" \
            "$CONTROL_SHA" "$QA_CANDIDATE_SHA"
      - name: Upload control receipts and logs
        if: always() && steps.scope.outputs.mode == 'measure'
        uses: actions/upload-artifact@v4
        with:
          name: biryong-immutable-main-control
          path: ${{ runner.temp }}/biryong-main-control/**
          if-no-files-found: warn
          retention-days: 7
