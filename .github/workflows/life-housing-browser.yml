name: Life housing candidate browser QA
on:
  pull_request:
    paths:
      - 'apps/world/src/rooms/**'
      - 'apps/world/src/phone/**'
      - 'apps/world/src/photo/**'
      - 'apps/world/src/seat-interaction.js'
      - 'apps/world/src/seat-anchors.js'
      - 'apps/world/src/context-action.js'
      - 'apps/world/src/player-dimensions.js'
      - 'apps/world/src/life-skills/**'
      - 'apps/world/src/shop/**'
      - 'apps/world/src/inventory/**'
      - 'apps/world/src/collection/**'
      - 'apps/world/src/main.js'
      - 'apps/world/tests/browser/*seating*'
      - 'apps/world/tests/browser/personal-room-environment*'
      - 'apps/world/tests/personal-room-environment.test.mjs'
      - 'apps/world/tests/browser/*furniture*'
      - 'apps/world/tests/browser/room-photo-story-*'
      - 'apps/world/tests/room-photo-story.test.mjs'
      - 'apps/world/tests/browser/*trophy*'
      - 'apps/world/tests/browser/*fishing-skill-effects*'
      - 'apps/world/tests/personal-room-seating.test.mjs'
      - 'apps/world/tests/furniture-*.test.mjs'
      - 'apps/world/tests/trophy-display.test.mjs'
      - 'apps/world/tests/shop-furniture-handoff.test.mjs'
      - 'apps/world/tests/fishing-skill-effect-labels.test.mjs'
      - 'apps/world/tests/browser/harness.mjs'
      - 'apps/world/tests/browser/package*.json'
      - 'apps/world/qa.mjs'
      - 'apps/world/styles.css'
      - 'apps/world/phone.css'
      - 'apps/world/campus/index.html'
      - 'apps/world/dev-server.mjs'
      - '.github/workflows/life-housing-browser.yml'
permissions:
  contents: read
concurrency:
  group: life-housing-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  candidate:
    name: life-housing-${{ matrix.smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        smoke:
          - personal-room-seating
          - furniture-history
          - furniture-recommendations
          - personal-room-environment
          - room-photo-story
          - trophy-display
          - trophy-display-null
          - shop-furniture
          - fishing-skill-effects
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install pinned offline browser dependencies
        working-directory: apps/world/tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and Korean glyphs
        if: matrix.smoke != 'trophy-display-null'
        run: |
          cd apps/world/tests/browser
          npx --no-install playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Record exact head and fixture source hashes
        env:
          SMOKE: ${{ matrix.smoke }}
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/head-sha.txt
          find apps/world/src apps/world/tests/browser -type f -not -path '*/node_modules/*' -print0 | sort -z | xargs -0 sha256sum > test-results/source-hashes.txt
          sha256sum apps/world/styles.css apps/world/phone.css >> test-results/source-hashes.txt
      - name: Exercise offline candidate flow
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          WORLD_SMOKE_TIMEOUT_MS: '120000'
          SMOKE: ${{ matrix.smoke }}
          TROPHY_DISPLAY_QA_OUTPUT: test-results/trophy-display
          ROOM_PHOTO_STORY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 840s node "apps/world/tests/browser/${SMOKE}-smoke.mjs" 2>&1 | tee "test-results/${SMOKE}.log"
      - name: Save exact-head browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-housing-${{ matrix.smoke }}-evidence
          path: test-results/
          if-no-files-found: error
          retention-days: 7
