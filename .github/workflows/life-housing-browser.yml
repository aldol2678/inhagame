name: Life housing candidate browser QA
on:
  pull_request:
    paths:
      - 'apps/world/src/**'
      - 'apps/world/tests/**'
      - 'apps/world/styles.css'
      - 'apps/world/campus/index.html'
      - 'apps/world/dev-server.mjs'
      - '.github/workflows/life-housing-browser.yml'
permissions:
  contents: read
concurrency:
  group: life-housing-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  candidate:
    name: life-housing-${{ matrix.smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        smoke:
          - personal-room-seating
          - furniture-history
          - trophy-display
          - trophy-display-null
          - shop-furniture
          - fishing-skill-effects
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install pinned offline browser dependencies
        working-directory: apps/world/tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and Korean glyphs
        if: matrix.smoke != 'trophy-display-null'
        run: |
          cd apps/world/tests/browser
          npx --no-install playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Record exact head and fixture source hashes
        env:
          SMOKE: ${{ matrix.smoke }}
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/head-sha.txt
          find apps/world/src apps/world/tests/browser -type f -not -path '*/node_modules/*' -print0 | sort -z | xargs -0 sha256sum > test-results/source-hashes.txt
          sha256sum apps/world/styles.css >> test-results/source-hashes.txt
      - name: Exercise offline candidate flow
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          WORLD_SMOKE_TIMEOUT_MS: '120000'
          SMOKE: ${{ matrix.smoke }}
          TROPHY_DISPLAY_QA_OUTPUT: test-results/trophy-display
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 840s node "apps/world/tests/browser/${SMOKE}-smoke.mjs" 2>&1 | tee "test-results/${SMOKE}.log"
      - name: Save exact-head browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-housing-${{ matrix.smoke }}-evidence
          path: test-results/
          if-no-files-found: error
          retention-days: 7
