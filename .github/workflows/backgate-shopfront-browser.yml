name: Backgate shopfront browser QA
on:
  pull_request:
    paths:
      - 'apps/world/src/backgate-shopfront-geometry.js'
      - 'apps/world/src/back-street-geometry.js'
      - 'apps/world/src/culture-street-geometry.js'
      - 'apps/world/src/culture-street-signs.js'
      - 'apps/world/tests/backgate-shopfront*.test.mjs'
      - 'apps/world/tests/browser/backgate-shopfront-*'
      - '.github/workflows/backgate-shopfront-browser.yml'
permissions:
  contents: read
concurrency:
  group: backgate-shopfront-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Verify pinned comparison commit is present
        run: git cat-file -e d9cbd3948e4e5acf359313824387dc8695c3e672^{commit}
      - name: Install existing pinned offline browser dependencies
        working-directory: apps/world/tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify facade, fixture and actual controller contracts
        run: node --test apps/world/tests/backgate-shopfront*.test.mjs
      - name: Verify actual renderer lifecycle without a browser
        run: |
          node apps/world/tests/browser/backgate-shopfront-null-smoke.mjs
          node apps/world/tests/browser/backgate-shopfront-fixture-null-smoke.mjs
      - name: Render exact-head old and new same-camera facade frames
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          WORLD_SMOKE_BROWSER: chrome
          WORLD_SMOKE_TIMEOUT_MS: '60000'
          WORLD_SHOPFRONT_QA_OUTPUT: test-results/backgate-shopfronts
          EXPECTED_SHOPFRONT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: timeout --signal=TERM --kill-after=15s 12m node apps/world/tests/browser/backgate-shopfront-smoke.mjs
      - name: Save exact-head screenshots and hashed report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backgate-shopfront-browser-${{ github.event.pull_request.head.sha }}
          path: test-results/backgate-shopfronts/
          if-no-files-found: error
          retention-days: 7
