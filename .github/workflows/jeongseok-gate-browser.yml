name: Jeongseok gate disposable browser QA
on:
  pull_request:
    paths:
      - '.github/workflows/jeongseok-gate-browser.yml'
      - 'apps/world/src/jeongseok/**'
      - 'apps/world/tests/jeongseok-access.test.mjs'
      - 'apps/world/tests/browser/jeongseok-gate-smoke.mjs'
      - 'supabase/migrations/20261012100000_world_jeongseok_access_jsl_a.sql'
      - 'supabase/tests/database/111_world_jeongseok_access_jsl_a.test.sql'
permissions:
  contents: read
concurrency:
  group: jeongseok-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  jsl-local-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      WORLD_SMOKE_DISABLE_WEBGPU: '1'
      JSL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head with read-only history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Integrate latest main in ephemeral runner only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$JSL_HEAD_SHA"
          base="$(git rev-parse refs/remotes/origin/main)"
          git config user.name "JSL QA Runner"
          git config user.email "jsl-qa@users.noreply.github.com"
          git merge --no-commit --no-ff "$base"
          git diff --cached --check
          mkdir -p test-results/jeongseok-gate
          printf 'PR_HEAD=%s\nMAIN_HEAD=%s\n' "$JSL_HEAD_SHA" "$base" > test-results/jeongseok-gate/integration-heads.txt
      - name: Install pinned test prerequisites
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install local Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      - name: Install pinned Chromium and local PostgreSQL client
        run: |
          set -euo pipefail
          npm ci --prefix apps/world/tests/browser --ignore-scripts --no-audit --no-fund
          (cd apps/world/tests/browser && npx --no-install playwright install --with-deps chromium)
          sudo apt-get install -y fonts-noto-cjk postgresql-client
      - name: Start disposable local database only
        run: |
          set -euo pipefail
          unset SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD
          supabase start > "$RUNNER_TEMP/jsl-local-start.log" 2>&1 || { echo 'Disposable local Supabase startup failed'; exit 1; }
      - name: Verify migrations, pgTAP, integration and JSL unit tests
        run: |
          set -euo pipefail
          supabase test db
          node scripts/local-integration.mjs
          node --test apps/world/tests/jeongseok-access.test.mjs
      - name: Read loopback-only Supabase credentials into runner environment
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const info = JSON.parse(execFileSync('supabase', ['status', '-o', 'json'], { encoding: 'utf8' }));
          for (const k of ['API_URL','DB_URL']) {
            const v = info[k];
            if (typeof v !== 'string' || !/^(https?:\/\/|postgres(?:ql)?:\/\/)([^@/]+@)?(127\.0\.0\.1|localhost)(:\d+)?(\/|$)/.test(v)) throw Error(k+' is not local loopback');
          }
          for (const k of ['API_URL','DB_URL','ANON_KEY','SERVICE_ROLE_KEY']) {
            const v = info[k];
            if (typeof v !== 'string' || !v || /[\r\n]/.test(v)) throw Error('Missing or malformed local '+k);
            if (k.includes('KEY') || k === 'DB_URL') process.stdout.write('::add-mask::'+v+'\n');
            appendFileSync(process.env.GITHUB_ENV, k+'='+v+'\n');
          }
          NODE
      - name: Signed-in Chromium desktop and mobile JSL-A browser QA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$JSL_HEAD_SHA"
          node apps/world/tests/browser/jeongseok-gate-smoke.mjs
      - name: Stop and discard local stack
        if: always()
        run: supabase stop --no-backup
      - name: Archive synthetic QA report and source refs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jeongseok-gate-${{ github.event.pull_request.head.sha }}
          path: |
            test-results/jeongseok-gate/report.json
            test-results/jeongseok-gate/integration-heads.txt
          if-no-files-found: warn
          retention-days: 7
