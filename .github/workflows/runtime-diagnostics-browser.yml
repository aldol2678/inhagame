name: Runtime diagnostics browser QA
on:
  pull_request:
    paths:
      - 'apps/world/src/diagnostics/**'
      - 'apps/world/src/main.js'
      - 'apps/world/campus/index.html'
      - 'apps/world/runtime-diagnostics.css'
      - 'apps/world/src/input/**'
      - 'apps/world/src/campus-hud.js'
      - 'apps/world/src/view-distance-settings.js'
      - 'apps/world/src/online/world-online.js'
      - 'apps/world/scripts/write-runtime-build-id.mjs'
      - 'apps/world/build-recast-shadow.sh'
      - 'apps/world/tests/runtime-diagnostics.test.mjs'
      - 'apps/world/tests/browser/runtime-diagnostics-*'
      - 'apps/world/tests/browser/harness*.mjs'
      - '.github/workflows/runtime-diagnostics-browser.yml'
permissions:
  contents: read
concurrency:
  group: runtime-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install pinned offline browser harness
        working-directory: apps/world/tests/browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Privacy, reports, identity lifecycle and HUD/InputFocus regression
        run: |
          node --test apps/world/tests/runtime-diagnostics.test.mjs apps/world/tests/input-focus-*.test.mjs apps/world/tests/hud-*.test.mjs apps/world/tests/graphics-settings-panel.test.mjs apps/world/tests/settings-registry.test.mjs
          node apps/world/qa.mjs
      - name: Desktop and touch browser integration with no production traffic
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
        run: |
          node apps/world/tests/browser/runtime-diagnostics-smoke.mjs
          node apps/world/tests/browser/mobile-hud-smoke.mjs
          node apps/world/tests/browser/lobby-layout-smoke.mjs
      - name: Preserve screenshots and scenario receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-diagnostics-evidence
          path: test-results/runtime-diagnostics/
          if-no-files-found: warn
          retention-days: 7
