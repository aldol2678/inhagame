name: Full Map readability browser QA
on:
  pull_request:
    paths:
      - 'apps/world/src/minimap/**'
      - 'apps/world/src/navigation/**'
      - 'apps/world/campus/index.html'
      - 'apps/world/styles.css'
      - 'apps/world/tests/full-map*.test.mjs'
      - 'apps/world/tests/mobile-full-map-portrait.test.mjs'
      - 'apps/world/tests/navigation-map-ui.test.mjs'
      - 'apps/world/tests/browser/full-map-readability-smoke.mjs'
      - 'apps/world/tests/browser/harness.mjs'
      - 'apps/world/tests/browser/package*.json'
      - '.github/workflows/full-map-readability-browser.yml'
permissions:
  contents: read
concurrency:
  group: full-map-readability-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install pinned offline browser dependencies
        working-directory: apps/world/tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Ensure Korean screenshot glyphs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p test-results/full-map-readability
          fc-match 'sans-serif:lang=ko' > test-results/full-map-readability/korean-font.txt
      - name: Verify map contracts
        run: node --test apps/world/tests/full-map*.test.mjs apps/world/tests/mobile-full-map-portrait.test.mjs apps/world/tests/navigation-map-ui.test.mjs apps/world/tests/room-map-data.test.mjs
      - name: Render real campus map in desktop and mobile Chromium
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          WORLD_SMOKE_BROWSER: chrome
          WORLD_FULL_MAP_QA_OUTPUT: test-results/full-map-readability
        run: node apps/world/tests/browser/full-map-readability-smoke.mjs
      - name: Preserve screenshots and assertion receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-map-readability-browser-evidence
          path: test-results/full-map-readability/
          if-no-files-found: error
          retention-days: 14
