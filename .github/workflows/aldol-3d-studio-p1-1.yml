name: ALDOL 3D Studio P1.1 Render and Touch QA

on:
  push:
    branches:
      - feat/aldol-3d-studio-p1-1-render-touch-20261020
    paths:
      - tools/aldol-3d-studio-p1/**
      - .github/workflows/aldol-3d-studio-p1-1.yml
  pull_request:
    paths:
      - tools/aldol-3d-studio-p1/**
      - .github/workflows/aldol-3d-studio-p1-1.yml

permissions:
  contents: read

concurrency:
  group: studio-p11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logic-and-real-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and logic regression
        working-directory: tools/aldol-3d-studio-p1
        run: |
          npm run check
          npm test
      - name: Real INHA WORLD editor command adapter
        working-directory: tools/aldol-3d-studio-p1
        env:
          INHA_WORLD_EDITOR_DIR: ${{ github.workspace }}/apps/world/src/editor
        run: npm run test:real
  chromium-http-and-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright from existing World QA dependencies
        working-directory: apps/world/tests/browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Full locally served page, rendered pixels, touch gestures
        run: node tools/aldol-3d-studio-p1/tests/browser-p11.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aldol-studio-p11-${{ github.sha }}
          path: test-results/aldol-studio-p1-1/
          if-no-files-found: warn
          retention-days: 7
