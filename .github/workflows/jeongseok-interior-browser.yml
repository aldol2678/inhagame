name: Jeongseok interior browser QA
on:
  pull_request:
    paths:
      - 'apps/world/src/jeongseok/**'
      - 'apps/world/src/rooms/room-registry.js'
      - 'apps/world/src/rooms/room-transition.js'
      - 'apps/world/src/rooms/room-world-adapter.js'
      - 'apps/world/src/main.js'
      - 'apps/world/tests/jeongseok-interior.test.mjs'
      - 'apps/world/tests/browser/jeongseok-interior-smoke.mjs'
      - '.github/workflows/jeongseok-interior-browser.yml'
permissions:
  contents: read
concurrency:
  group: jeongseok-interior-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install Korean glyph coverage for readable screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Install existing pinned browser dependencies
        working-directory: apps/world/tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Interior layout, policy and transition contracts
        run: node --test apps/world/tests/jeongseok-interior.test.mjs apps/world/tests/room-transition-*.test.mjs apps/world/tests/club-room.test.mjs apps/world/tests/dorm1-lobby.test.mjs apps/world/tests/personal-room.test.mjs
      - name: Real campus boot, Jeongseok loop on desktop and mobile viewports
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          WORLD_SMOKE_BROWSER: chrome
          JSL_B_QA_OUTPUT: test-results/jeongseok-interior
          EXPECTED_JSL_B_HEAD: ${{ github.event.pull_request.head.sha }}
        run: timeout --signal=TERM --kill-after=10s 900s node apps/world/tests/browser/jeongseok-interior-smoke.mjs
      - name: Save exact-head browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jeongseok-interior-browser-evidence
          path: test-results/jeongseok-interior/
          if-no-files-found: error
          retention-days: 7
