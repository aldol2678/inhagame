name: Player activity audio browser QA
on:
  pull_request:
    paths:
      - '.github/ci/phone-surface-scope*.mjs'
      - 'apps/world/src/audio/**'
      - 'apps/world/src/player-controller.js'
      - 'apps/world/src/main.js'
      - 'apps/world/src/rooms/room-transition.js'
      - 'apps/world/tests/player-activity-audio*.test.mjs'
      - 'apps/world/tests/browser/player-activity-audio-*'
      - '.github/workflows/player-activity-audio-browser.yml'
permissions:
  contents: read
concurrency:
  group: player-activity-audio-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 20
      - name: Conservative scope gate for isolated Phone Messages change
        id: phone_scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/ci/phone-surface-scope.mjs >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.phone_scope.outputs.skip != 'true'
        with:
          node-version: '24.19.0'
      - name: Install pinned browser dependencies
        if: steps.phone_scope.outputs.skip != 'true'
        working-directory: apps/world/tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        if: steps.phone_scope.outputs.skip != 'true'
        working-directory: apps/world/tests/browser
        run: npx playwright install --with-deps chromium
      - name: Verify activity, room and hosted evidence contracts
        if: steps.phone_scope.outputs.skip != 'true'
        run: node --test apps/world/tests/player-activity-audio*.test.mjs apps/world/tests/world-audio.test.mjs apps/world/tests/room-transition*.test.mjs
      - name: Verify real Web Audio scheduling and capture generated output
        if: steps.phone_scope.outputs.skip != 'true'
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          EXPECTED_ACTIVITY_AUDIO_HEAD: ${{ github.event.pull_request.head.sha }}
          ACTIVITY_AUDIO_QA_OUTPUT: test-results/player-activity-audio
        run: node apps/world/tests/browser/player-activity-audio-smoke.mjs
      - name: Save exact-head browser and generated audio evidence
        if: always() && steps.phone_scope.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: player-activity-audio-${{ github.event.pull_request.head.sha }}
          path: test-results/player-activity-audio/
          if-no-files-found: error
          retention-days: 14
