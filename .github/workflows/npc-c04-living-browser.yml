name: C04 photo and bench browser QA
on:
  pull_request:
    paths:
      - 'apps/world/npc-factory/**'
      - 'apps/world/src/seat-anchors.js'
      - 'apps/world/src/photo/inkyung-photo-point.js'
      - 'apps/world/src/life-props.js'
      - 'apps/world/tests/npc-c04*.test.mjs'
      - 'apps/world/tests/browser/npc-c04-*.mjs'
      - 'apps/world/tests/browser/npc-campus-life-diversity-smoke.mjs'
      - 'apps/world/tests/browser/harness*.mjs'
      - 'apps/world/tests/browser/package*.json'
      - '.github/workflows/npc-c04-living-browser.yml'
permissions:
  contents: read
concurrency:
  group: npc-c04-living-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, portrait, landscape]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install existing pinned offline browser dependencies
        run: npm ci --prefix apps/world/tests/browser --ignore-scripts --no-audit --no-fund
      - name: Ensure readable Korean glyphs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify C04 acceptance and shared NPC contracts
        run: node --test apps/world/tests/npc-c04*.test.mjs apps/world/tests/npc-shared-campus.test.mjs apps/world/tests/npc-campus-life-diversity.test.mjs
      - name: Render exact-head photo, seat, approach, arrival and departure
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          WORLD_SMOKE_BROWSER: chrome
          EXPECTED_C04_HEAD: ${{ github.event.pull_request.head.sha }}
          C04_VIEWPORT: ${{ matrix.viewport }}
          C04_OUTPUT: test-results/npc-c04/${{ matrix.viewport }}
        run: timeout --signal=TERM --kill-after=10s 1120s node apps/world/tests/browser/npc-c04-living-smoke.mjs
      - name: Preserve source-bound pixels and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npc-c04-living-${{ matrix.viewport }}
          path: test-results/npc-c04/${{ matrix.viewport }}/
          if-no-files-found: error
          retention-days: 14
