name: Private character acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/private-character-acceptance.yml'
      - '.github/workflows/world-asset-optimizer.yml'
      - 'apps/world/src/**'
      - 'apps/world/api/brand-asset.js'
      - 'apps/world/tests/**'
      - 'tools/world-assets/**'
permissions:
  contents: read
jobs:
  private-character-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DRAGON_SHA: 5b53dd9a13e2123bab399f68483c3fa72259b75888edf67b9bab32553a53fc23
      LOCAL_OPTIMIZED_DRAGON_SHA: 72e616f07a41ba97562da62ab7b735631d7a21b99986131da5f83cf929ffd20a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact acceptance source revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --prefix apps/world/tests/browser --ignore-scripts
      - name: Download approved private assets and verify exact bytes
        env:
          ASSET_BASE: https://inhagame.app
          ACCEPTANCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DUCK_SHA: bec8585e3e64f092585c23e353ae833215a25ceffa850d819bce7d34d70f01ea
        run: |
          set -euo pipefail
          [[ "$ASSET_BASE" =~ ^https://[a-zA-Z0-9.-]+$ ]]
          [[ "$DUCK_SHA" =~ ^[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/private-character" test-results/annyongi
          curl --fail --silent --show-error --retry 2 "$ASSET_BASE/api/brand-asset?asset=annyongi-flight-v1.glb&variant=canonical&revision=$DRAGON_SHA" -o "$RUNNER_TEMP/private-character/source.glb"
          curl --fail --silent --show-error --retry 2 "$ASSET_BASE/api/brand-asset?asset=induck-v3.glb&variant=canonical" -o "$RUNNER_TEMP/private-character/duck.glb"
          printf '%s  %s\n' "$DRAGON_SHA" "$RUNNER_TEMP/private-character/source.glb" "$DUCK_SHA" "$RUNNER_TEMP/private-character/duck.glb" | sha256sum --check
          cp "$RUNNER_TEMP/private-character/source.glb" apps/world/assets/annyongi-flight-v1.glb
          cp "$RUNNER_TEMP/private-character/duck.glb" apps/world/assets/induck-v3.glb
          node -e 'const fs=require("fs"),crypto=require("crypto");const paths=["apps/world/assets/annyongi-flight-v1.glb","apps/world/assets/induck-v3.glb"];fs.writeFileSync("test-results/annyongi/private-asset-provenance.json",JSON.stringify({head:process.env.ACCEPTANCE_HEAD_SHA,assets:paths.map(path=>({path,sha256:crypto.createHash("sha256").update(fs.readFileSync(path)).digest("hex"),bytes:fs.statSync(path).size}))},null,2));'
      - name: Generate local optimized comparison from verified source assets
        run: |
          npm ci --prefix tools/world-assets --ignore-scripts
          npm run verify --prefix tools/world-assets
      - name: Audit exact private facial surface separation
        run: |
          node apps/world/tests/browser/annyongi-face-interior-audit.mjs apps/world/assets/annyongi-flight-v1.glb "$DRAGON_SHA" > test-results/annyongi/face-source-geometry.json
          node apps/world/tests/browser/annyongi-face-interior-audit.mjs apps/world/.generated/assets-optimized/annyongi-flight-v1.glb "$LOCAL_OPTIMIZED_DRAGON_SHA" > test-results/annyongi/face-optimized-geometry.json
      - name: Real asset lifecycle and mount regression
        run: node --test apps/world/tests/character-model-loading.test.mjs apps/world/tests/photo-mounted.test.mjs apps/world/tests/browser/character-model-loading-runtime.test.mjs
      - name: Install Chromium
        working-directory: apps/world/tests/browser
        run: npx playwright install --with-deps chromium
      - name: Full facial contrast and measured-continuity regression
        timeout-minutes: 35
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          ANNYONGI_FACE_PROFILE: acceptance
          CHARACTER_SMOKE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node apps/world/tests/browser/annyongi-face-diagnostic.mjs
      - name: Upload early facial metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-face-acceptance-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/annyongi/face-diagnostic.json
            test-results/annyongi/face-source-geometry.json
            test-results/annyongi/face-optimized-geometry.json
          if-no-files-found: warn
          retention-days: 7
      - name: Browser ownership, six states, optimization parity and actual campus inputs
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          CHARACTER_SMOKE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node apps/world/tests/browser/character-model-loading-smoke.mjs
          node apps/world/tests/browser/annyongi-color-smoke.mjs
          node apps/world/tests/browser/annyongi-capture.mjs
          node apps/world/tests/browser/annyongi-flight-pose-capture.mjs
          node apps/world/tests/browser/annyongi-campus-smoke.mjs
      - name: Upload metadata-only test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-character-metadata-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/character-model/result.json
            test-results/annyongi/private-asset-provenance.json
            test-results/annyongi/result.json
            test-results/annyongi/color-results.json
            test-results/annyongi/face-diagnostic.json
            test-results/annyongi/face-source-geometry.json
            test-results/annyongi/face-optimized-geometry.json
            test-results/annyongi/poses/pose-results.json
            test-results/annyongi/campus-results.json
            test-results/character-model-optimized/result.json
            test-results/annyongi-optimized/campus-results.json
          if-no-files-found: warn
          retention-days: 7
