name: Biryong rendering diagnostic only

on:
  pull_request:
    paths:
      - 'apps/world/tests/browser/biryong-render-trace*.mjs'
      - 'apps/world/tests/biryong-render-trace*.test.mjs'
      - '.github/workflows/biryong-render-trace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-diagnostic-not-performance-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORLD_SMOKE_DISABLE_WEBGPU: '1'
      WORLD_SMOKE_BROWSER: chrome
      BIRYONG_PERF_WORLD_ROOT: ${{ github.workspace }}/.qa-control-main/apps/world
    steps:
      - name: Checkout diagnostic sampler
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout immutable main control
        uses: actions/checkout@v4
        with:
          ref: e49419c39d884515f2402a2f3a23fe4c754b8882
          path: .qa-control-main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Check diagnostic contracts
        run: node --test apps/world/tests/biryong-render-trace*.test.mjs
      - name: Install same pinned offline browser engine
        working-directory: apps/world/tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Collect bounded LOW OFF baseline-half-baseline diagnostic
        env:
          BIRYONG_TRACE_OUTPUT: ${{ runner.temp }}/biryong-render-trace
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$BIRYONG_TRACE_OUTPUT"
          GITHUB_SHA="$(git rev-parse HEAD)" timeout --signal=TERM --kill-after=10s 6m node apps/world/tests/browser/biryong-render-trace.mjs 2>&1 | tee "$BIRYONG_TRACE_OUTPUT/diagnostic.log"
      - name: State diagnostic scope
        if: always()
        run: |
          echo 'Diagnostic collection only. A green job means collection succeeded, NOT performance acceptance. Existing 85/160 ms budgets are unchanged; no GPU timer measurement or physical-device conclusion.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve full or partial diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biryong-render-trace-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/biryong-render-trace/**
          if-no-files-found: warn
          retention-days: 7
