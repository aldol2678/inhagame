name: ALDOL 3D Studio P1 Retire Archive Transport

on:
  push:
    branches:
      - feat/aldol-3d-studio-p1-20261020
    paths:
      - .github/workflows/aldol-3d-studio-p1-retire-transport.yml

permissions:
  contents: read

concurrency:
  group: aldol-p1-retire-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retire-after-regression:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/aldol-3d-studio-p1-20261020'
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aldol-3d-studio-p1-20261020
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify archive and exact source parity
        shell: bash
        run: |
          set -euo pipefail
          root="tools/aldol-3d-studio-p1"
          test -f "$root/src/world-scene-adapter.mjs"
          test -f "$root/package.json"
          cat "$root"/transport/chunk-{00..06}.b64 | base64 --decode > "$RUNNER_TEMP/p1-core.tar.br"
          echo "9c18dd09f6310c37402fb694cb560b78dbce429ee9abf6022dc57c51f8bef5f9  $RUNNER_TEMP/p1-core.tar.br" | sha256sum --check -
          node -e "const fs=require('node:fs'),z=require('node:zlib');fs.writeFileSync(process.env.RUNNER_TEMP+'/p1-core.tar',z.brotliDecompressSync(fs.readFileSync(process.env.RUNNER_TEMP+'/p1-core.tar.br')))"
          mkdir -p "$RUNNER_TEMP/p1-transport"
          tar -xf "$RUNNER_TEMP/p1-core.tar" -C "$RUNNER_TEMP/p1-transport"
          for dir in bin src web tests; do diff -qr "$RUNNER_TEMP/p1-transport/$dir" "$root/$dir"; done
          cmp "$RUNNER_TEMP/p1-transport/package.json" "$root/package.json"
      - name: Run readable source tests
        working-directory: tools/aldol-3d-studio-p1
        run: |
          npm run check
          npm test
      - name: Real INHA WORLD editor regression
        working-directory: tools/aldol-3d-studio-p1
        env:
          INHA_WORLD_EDITOR_DIR: ${{ github.workspace }}/apps/world/src/editor
        run: npm run test:real
      - name: Commit archive removal after all gates PASS
        shell: bash
        run: |
          set -euo pipefail
          git rm -f tools/aldol-3d-studio-p1/transport/chunk-{00..06}.b64
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(3d-studio): retire compressed P1 source after parity and real-source PASS"
          git push origin HEAD:refs/heads/feat/aldol-3d-studio-p1-20261020
