      - 'apps/world/src/environment/**'
      - 'apps/world/src/biryong/**'
      - 'apps/world/tests/browser/graphics-parallel-smoke.mjs'
      - 'apps/world/tests/browser/biryong-night-pixel-policy.mjs'
      - 'apps/world/tests/biryong-night-readability.test.mjs'
      - 'apps/world/tests/graphics-parallel-smoke-contract.test.mjs'
      - 'apps/world/src/guestbook/**'
      - 'apps/world/tests/guestbook*.test.mjs'
      - 'apps/world/tests/browser/guestbook-load-retry-*'
      - '.github/workflows/reusable-browser-qa.yml'
      - 'apps/world/src/main-hall-*.js'
      - 'apps/world/src/photo-hall-library-geometry.js'
      - 'apps/world/src/library-approaches.js'
      - 'apps/world/src/jeongseok-entry-geometry.js'
      - 'apps/world/src/jeongseok-candidate-renderer.js'
      - 'apps/world/src/campus-landmark-candidate-selector.js'
      - 'apps/world/src/preview/place-scene-preview.js'
      - 'apps/world/tests/*hall*.test.mjs'
      - 'apps/world/tests/jeongseok-entry-geometry.test.mjs'
      - 'apps/world/tests/fixtures/hall-library-candidate-source-manifest.json'
      - 'apps/world/tests/browser/hall-library-*'
      - 'apps/world/data/reality/hall-library-integration.provenance.json'
      - 'apps/world/src/audio/**'
      - 'apps/world/src/player-controller.js'
      - 'apps/world/src/rooms/room-transition.js'
      - 'apps/world/tests/player-activity-audio*.test.mjs'
      - 'apps/world/tests/browser/player-activity-audio-*'
      - 'apps/world/src/quest/**'
      - 'apps/world/src/input/input-focus-manager.js'
      - 'apps/world/tests/quest-journal*.test.mjs'
      - 'apps/world/tests/browser/quest-journal-controls-*'
      - 'apps/world/src/diagnostics/**'
      - 'apps/world/runtime-diagnostics.css'
      - 'apps/world/src/input/**'
      - 'apps/world/src/campus-hud.js'
      - 'apps/world/src/online/world-online.js'
      - 'apps/world/scripts/write-runtime-build-id.mjs'
      - 'apps/world/build-recast-shadow.sh'
      - 'apps/world/tests/runtime-diagnostics.test.mjs'
      - 'apps/world/tests/browser/runtime-diagnostics-*'
      - 'apps/world/src/ui/ui-icon-runtime.js'
      - 'apps/world/ui-icon-runtime.css'
      - 'apps/world/tests/ui-icon-runtime.test.mjs'
      - 'apps/world/tests/browser/ui-icon-runtime-smoke.mjs'
      - 'apps/world/src/lobby/**'
      - 'apps/world/src/webgpu-device.js'
      - 'apps/world/tests/boot-recovery.test.mjs'
      - 'apps/world/tests/world-boot-diagnostics.test.mjs'
      - 'apps/world/tests/world-loading-render.test.mjs'
      - 'apps/world/tests/browser/boot-recovery-smoke.mjs'
      - 'apps/world/release/cloudflare-live/overrides/src/lobby/boot-recovery.js'
      - 'apps/world/tests/browser/loading-render-smoke.mjs'
      - 'apps/world/tests/browser/mobile-boot-smoke.mjs'
      - 'apps/world/tests/browser/unsupported-smoke.mjs'
      - 'apps/world/npc-factory/main2-quest-client.mjs'
      - 'apps/world/src/next-discovery.js'
      - 'apps/world/tests/main2-status-recovery.test.mjs'
      - 'apps/world/tests/next-discovery.test.mjs'
      - 'apps/world/tests/browser/main2-status-recovery-smoke.mjs'
      - 'apps/world/tests/browser/next-discovery-smoke.mjs'
      - 'apps/world/src/online/world-population-heartbeat.js'
      - 'apps/world/tests/world-population-heartbeat.test.mjs'
      - 'apps/world/tests/browser/world-population-bfcache-smoke.mjs'
      - 'apps/world/src/shop/**'
      - 'apps/world/src/appearance/**'
      - 'apps/world/src/wallet/**'
      - 'apps/world/src/progression/**'
      - 'apps/world/tests/*stability*.test.mjs'
      - 'apps/world/tests/*readback*.test.mjs'
      - 'apps/world/tests/*ordering*.test.mjs'
      - 'apps/world/tests/*ownership*.test.mjs'
      - 'apps/world/tests/*isolation*.test.mjs'
      - 'apps/world/tests/browser/world-stability-*'
      - 'apps/world/tests/browser/package*.json'
      - 'apps/world/tests/browser/harness.mjs'
      - '.github/ci/group-filter.mjs'
      - '.github/ci/group-filter.test.mjs'
      - '.github/ci/phone-surface-scope.mjs'
      - '.github/actions/setup-world-browser/**'
      - '.github/workflows/world-browser-qa.yml'
permissions:
  contents: read
concurrency:
  group: world-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      asset_runtime: ${{ steps.filter.outputs.asset_runtime }}
      character_model: ${{ steps.filter.outputs.character_model }}
      collection_book: ${{ steps.filter.outputs.collection_book }}
      combat_input: ${{ steps.filter.outputs.combat_input }}
      cooking_candidate: ${{ steps.filter.outputs.cooking_candidate }}
      daily_panel_focus: ${{ steps.filter.outputs.daily_panel_focus }}
      graphics_integration: ${{ steps.filter.outputs.graphics_integration }}
      guestbook_load_retry: ${{ steps.filter.outputs.guestbook_load_retry }}
      hall_library_candidate: ${{ steps.filter.outputs.hall_library_candidate }}
      player_activity_audio: ${{ steps.filter.outputs.player_activity_audio }}
      quest_journal_controls: ${{ steps.filter.outputs.quest_journal_controls }}
      runtime_diagnostics: ${{ steps.filter.outputs.runtime_diagnostics }}
      ui_icons_runtime: ${{ steps.filter.outputs.ui_icons_runtime }}
      world_boot_recovery: ${{ steps.filter.outputs.world_boot_recovery }}
      world_main2_recovery: ${{ steps.filter.outputs.world_main2_recovery }}
      world_population_bfcache: ${{ steps.filter.outputs.world_population_bfcache }}
      world_stability: ${{ steps.filter.outputs.world_stability }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Test suite selection
        run: node --test .github/ci/group-filter.test.mjs
      - name: Select suites touched by this pull request
        id: filter
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/ci/group-filter.mjs browser >> "$GITHUB_OUTPUT"

  asset-runtime:
    needs: select
    if: ${{ !cancelled() && needs.select.outputs.asset_runtime != 'false' }}
    name: ${{ matrix.lane }} WebGL2 fixture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lane: [fishing, life]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 128
      - name: Select affected browser suite (fail-closed)
        id: phone_scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_PR_TITLE: ${{ github.event.pull_request.title }}
          # The scope gate is keyed by the original workflow name and reads its paths.
          CI_WORKFLOW_NAME: Asset runtime browser QA
        run: node .github/ci/phone-surface-scope.mjs >> "$GITHUB_OUTPUT"
      - name: Install pinned Node, browser dependencies and Chromium
        if: steps.phone_scope.outputs.skip != 'true'
        uses: ./.github/actions/setup-world-browser
        with:
          playwright-browser: chromium
      - name: Install Korean glyphs
        if: steps.phone_scope.outputs.skip != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Check asset and lifecycle contracts
        if: steps.phone_scope.outputs.skip != 'true'
        run: |
          node --test apps/world/tests/*fishing*.test.mjs apps/world/tests/life-props*.test.mjs apps/world/tests/asset-runtime-browser-workflow.test.mjs
          node apps/world/tests/browser/fishing-engine-contract.mjs
          node apps/world/tests/browser/life-props-engine.mjs
      - name: Capture actual WebGL2 fixture pixels and lifecycle evidence
        if: steps.phone_scope.outputs.skip != 'true'
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          EXPECTED_ASSET_RUNTIME_HEAD: ${{ github.event.pull_request.head.sha }}
          FISHING_ASSETS_OUTPUT: test-results/asset-runtime/fishing
          LIFE_PROPS_BROWSER_OUTPUT: test-results/asset-runtime/life
        run: |
          if [[ '${{ matrix.lane }}' == 'fishing' ]]; then
            node apps/world/tests/browser/fishing-assets-smoke.mjs
          else
            node apps/world/tests/browser/life-props-browser-smoke.mjs
          fi
      - name: Preserve exact-head browser evidence
        if: always() && steps.phone_scope.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: asset-runtime-${{ matrix.lane }}-${{ github.event.pull_request.head.sha }}
          path: test-results/asset-runtime/${{ matrix.lane }}/
          if-no-files-found: error
          retention-days: 14

  character-model:
    needs: select
    if: ${{ !cancelled() && needs.select.outputs.character_model != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install pinned Node, browser dependencies and Chromium
        uses: ./.github/actions/setup-world-browser
        with:
          playwright-browser: chromium
      - name: Reproducible Annyongi asset, provenance and optimization
        run: |
          python3 tools/world-assets/build-annyongi.py
          git diff --exit-code -- apps/world/assets/annyongi-flight-v1.glb
          node apps/world/assets/check_characters.mjs
          npm ci --prefix tools/world-assets --ignore-scripts
          npm test --prefix tools/world-assets
          node tools/world-assets/optimize-world-assets.mjs --strict
          node tools/world-assets/validate-annyongi.mjs
      - name: Real GLB ownership and lifecycle (pinned Null device)
        run: node --test apps/world/tests/browser/character-model-loading-runtime.test.mjs
      - name: Actual WebGL2 partial failure and disposal
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          CHARACTER_SMOKE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node apps/world/tests/browser/character-model-loading-smoke.mjs
      - name: Annyongi desktop and mobile flight acceptance
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
        run: |
          node apps/world/tests/browser/annyongi-capture.mjs
          node apps/world/tests/browser/annyongi-flight-pose-capture.mjs
          node apps/world/tests/browser/annyongi-campus-smoke.mjs
      - name: Upload exact-head browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: character-model-browser-${{ github.event.pull_request.head.sha }}
          path: |
            test-results/character-model
            test-results/annyongi
          if-no-files-found: warn
          retention-days: 14

  collection-book:
    needs: select
    if: ${{ !cancelled() && needs.select.outputs.collection_book != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install pinned Node, browser dependencies and Chromium
        uses: ./.github/actions/setup-world-browser
        with:
          playwright-browser: chromium
      - name: Install Korean glyphs
        run: |
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Verify self-only projection and account guards
        run: node --test apps/world/tests/collection-book*.test.mjs apps/world/tests/inventory*.test.mjs apps/world/tests/guestbook-account-panel.test.mjs apps/world/tests/item-icons.test.mjs
      - name: Exercise offline keyboard, touch and stale-response recovery
        env:
          EXPECTED_COLLECTION_BOOK_HEAD: ${{ github.event.pull_request.head.sha }}
          COLLECTION_BOOK_OUTPUT: test-results/collection-book
        run: node apps/world/tests/browser/collection-book-smoke.mjs
      - name: Verify icon decode, responsive layout and broken-image recovery
        env:
          EXPECTED_ITEM_ICONS_HEAD: ${{ github.event.pull_request.head.sha }}
          ITEM_ICONS_OUTPUT: test-results/collection-book/item-icons
        run: node apps/world/tests/browser/item-icons-smoke.mjs
      - name: Preserve immutable browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-book-${{ github.event.pull_request.head.sha }}
          path: test-results/collection-book/
          if-no-files-found: error
          retention-days: 14

  combat-input:
    needs: select
    if: ${{ !cancelled() && needs.select.outputs.combat_input != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install pinned Node and browser dependencies
        uses: ./.github/actions/setup-world-browser
      - name: Ensure readable Korean pixels
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify combat, chat, focus and touch contracts
        run: node --test apps/world/tests/combat-hud-activation.test.mjs apps/world/tests/combat-input-authority.test.mjs apps/world/tests/input-focus-chat.test.mjs apps/world/tests/player-touch-ownership.test.mjs
      - name: Verify exact-head native input and desktop/mobile Campus pixels
        timeout-minutes: 10
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          WORLD_SMOKE_BROWSER: chrome
          EXPECTED_COMBAT_HEAD: ${{ github.event.pull_request.head.sha }}
          COMBAT_QA_OUTPUT: test-results/combat-input
        run: timeout --signal=TERM --kill-after=10s 560s node apps/world/tests/browser/combat-hud-activation-smoke.mjs
      - name: Preserve exact-head input receipts and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-input-${{ github.event.pull_request.head.sha }}
          path: test-results/combat-input/
          if-no-files-found: error
          retention-days: 14

  cooking-candidate:
    needs: select
    if: ${{ !cancelled() && needs.select.outputs.cooking_candidate != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 128
      - name: Select affected browser suite (fail-closed)
        id: phone_scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_PR_TITLE: ${{ github.event.pull_request.title }}
          # The scope gate is keyed by the original workflow name and reads its paths.
          CI_WORKFLOW_NAME: Cooking candidate browser QA
        run: node .github/ci/phone-surface-scope.mjs >> "$GITHUB_OUTPUT"
      - name: Capture immutable candidate identity
        if: steps.phone_scope.outputs.skip != 'true'
        env:
          EXPECTED_COOKING_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p test-results/cooking-candidate
          git rev-parse HEAD | tee test-results/cooking-candidate/head.txt
          test "$(git rev-parse HEAD)" = "$EXPECTED_COOKING_HEAD"
      - name: Install pinned Node, browser dependencies and Chromium
        if: steps.phone_scope.outputs.skip != 'true'
        uses: ./.github/actions/setup-world-browser
        with:
          playwright-browser: chromium
      - name: Install Korean glyphs
        if: steps.phone_scope.outputs.skip != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Check production cooking regressions and fixture syntax
        if: steps.phone_scope.outputs.skip != 'true'
        shell: bash
        run: |
          set -o pipefail
          node --check apps/world/tests/browser/cooking-candidate-fixture.mjs
          node --check apps/world/tests/browser/cooking-candidate-smoke.mjs
          node --test apps/world/tests/cooking-client.test.mjs apps/world/tests/cooking-feature.test.mjs apps/world/tests/cooking-panel.test.mjs apps/world/tests/cooking-runtime-wiring.test.mjs 2>&1 | tee test-results/cooking-candidate/node-tests.log
      - name: Exercise real DOM with synthetic local cooking and Inventory only
        if: steps.phone_scope.outputs.skip != 'true'
        shell: bash
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          EXPECTED_COOKING_HEAD: ${{ github.event.pull_request.head.sha }}
          COOKING_QA_OUTPUT: test-results/cooking-candidate
        run: |
          set -o pipefail
          node apps/world/tests/browser/cooking-candidate-smoke.mjs 2>&1 | tee test-results/cooking-candidate/browser.log
      - name: Save exact-head logs, screenshots and source hashes
        if: always() && steps.phone_scope.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cooking-candidate-browser-${{ github.event.pull_request.head.sha }}
          path: test-results/cooking-candidate/
          if-no-files-found: error
          retention-days: 14

  daily-panel-focus:
    needs: select
    if: ${{ !cancelled() && needs.select.outputs.daily_panel_focus != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install pinned Node, browser dependencies and Chromium
        uses: ./.github/actions/setup-world-browser
        with:
          playwright-browser: chromium
      - name: Install Korean glyphs
        run: |
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify daily panel focus and account contracts
        run: node --test apps/world/tests/daily-panel-focus*.test.mjs apps/world/tests/attendance.test.mjs apps/world/tests/daily-quiz.test.mjs
      - name: Exercise native desktop, portrait and landscape controls with synthetic RPCs
        env:
          DAILY_PANEL_FOCUS_HEAD: ${{ github.event.pull_request.head.sha }}
          DAILY_PANEL_FOCUS_OUTPUT: test-results/daily-panel-focus
        run: timeout --signal=TERM --kill-after=10s 360s node apps/world/tests/browser/daily-panel-focus-smoke.mjs
      - name: Preserve exact-head source receipts and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-panel-focus-browser-evidence
          path: test-results/daily-panel-focus/
          if-no-files-found: error
          retention-days: 14

  graphics-integration:
    needs: select
    if: ${{ !cancelled() && needs.select.outputs.graphics_integration != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 128
      - name: Select affected browser suite (fail-closed)
        id: phone_scope
        env:
