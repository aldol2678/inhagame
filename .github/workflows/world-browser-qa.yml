          EXPECTED_HALL_HEAD: ${{ github.event.pull_request.head.sha }}
          WORLD_HALL_LIBRARY_SCOPE_BASE: ${{ github.event.pull_request.base.sha }}
          WORLD_HALL_LIBRARY_SCOPE_EXTENSION: ${{ github.event.pull_request.head.ref == 'fix/campus-surroundings-parity-20261004' && 'surroundings' || github.event.pull_request.head.ref == 'graphics/parallel-integration-20261008' && 'graphics' || github.event.pull_request.head.ref == 'feat/60th-five-walkway-20261012' && 'walkway' || github.event.pull_request.head.ref == 'release/2026-10-13-ci-runtime-diagnostics' && 'release-2026-10-13' || '' }}
        run: node apps/world/tests/browser/hall-library-hosted-smoke.mjs
