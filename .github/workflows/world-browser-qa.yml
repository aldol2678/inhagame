    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch immutable read-only comparison sources
        run: |
          git fetch --no-tags origin 1c6f43b36962f65f75cddd55b8661bb3aa4a268d
          git fetch --no-tags origin 316c8ff95f7a12618ec8db61342d153f3cbb29ea
          git fetch --no-tags origin 68d64e7466a2971256485b74e76c89a31e91547a
          git fetch --no-tags origin 2b9a09615f7986e3d5e5b93d731fba21f33afbdd
      - name: Install pinned Node and browser dependencies
        uses: ./.github/actions/setup-world-browser
      - name: Verify geometry and narrow current-main preservation
        run: node --test apps/world/tests/main-hall-candidate.test.mjs apps/world/tests/photo-hall-library.test.mjs apps/world/tests/hall-library-integration.test.mjs apps/world/tests/hall-library-hosted.test.mjs apps/world/tests/jeongseok-entry-geometry.test.mjs
      - name: Verify bounded graphics integration contracts
        if: github.event.pull_request.head.ref == 'graphics/parallel-integration-20261008'
        run: >-
          node --test
          apps/world/tests/biryong-*.test.mjs
          apps/world/tests/environment-continuous-daylight.test.mjs
          apps/world/tests/graphics-detail-settings.test.mjs
          apps/world/tests/graphics-settings-panel.test.mjs
          apps/world/tests/graphics-parallel-smoke-contract.test.mjs
          apps/world/tests/campus-contact-shading.test.mjs
      - name: Verify bounded walkway integration contracts
        if: github.event.pull_request.head.ref == 'feat/60th-five-walkway-20261012' || github.event.pull_request.head.ref == 'release/2026-10-13-ci-runtime-diagnostics'
        run: node --test apps/world/tests/north-walkway.test.mjs apps/world/tests/north-walkway-batching.test.mjs apps/world/tests/north-landmark-restoration.test.mjs apps/world/tests/campus-material-profile.test.mjs
