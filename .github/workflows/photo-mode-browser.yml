name: Photo Mode browser QA
on:
  pull_request:
    paths:
      - 'apps/world/src/photo/**'
      - 'apps/world/src/main.js'
      - 'apps/world/src/world-collision.js'
      - 'apps/world/src/player-controller.js'
      - 'apps/world/src/campus-layout.js'
      - 'apps/world/src/world-exterior-bounds.js'
      - 'apps/world/src/main-gate-frame.js'
      - 'apps/world/src/editor/main-gate-production.js'
      - 'apps/world/src/student-center-*.js'
      - 'apps/world/src/orbit-camera-controller.js'
      - 'apps/world/src/input/**'
      - 'apps/world/campus/index.html'
      - 'apps/world/styles.css'
      - 'apps/world/npc-factory/dev-runtime-state.mjs'
      - 'apps/world/tests/photo-*.test.mjs'
      - 'apps/world/tests/inkyung-photo-point.test.mjs'
      - 'apps/world/tests/world-bounds-boot-order.test.mjs'
      - 'apps/world/tests/browser/ipad-webkit-boot-smoke.mjs'
      - 'apps/world/tests/browser/photo-mode-*'
      - '.github/workflows/photo-mode-browser.yml'
permissions:
  contents: read
concurrency:
  group: photo-mode-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  chromium-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/world/tests/browser/package-lock.json
      - name: Install readable Korean glyphs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Install existing pinned browser dependencies
        working-directory: apps/world/tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify photo lifecycle, rig, input and NPC anchor contracts
        run: |
          node --test apps/world/tests/photo-*.test.mjs apps/world/tests/inkyung-photo-point.test.mjs apps/world/tests/world-boot-diagnostics.test.mjs
          node apps/world/npc-factory/tests-dev-runtime.mjs
      - name: Verify native photo controls with production modules
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          WORLD_SMOKE_BROWSER: chrome
          PHOTO_MODE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PHOTO_MODE_QA_OUTPUT: test-results/photo-mode/controls
        run: timeout --signal=TERM --kill-after=10s 420s node apps/world/tests/browser/photo-mode-smoke.mjs
      - name: Preserve controls evidence shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-mode-part-controls
          path: test-results/photo-mode/
          if-no-files-found: warn
          retention-days: 1

  chromium-png:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/world/tests/browser/package-lock.json
      - name: Install readable Korean glyphs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Install existing pinned browser dependencies
        working-directory: apps/world/tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Decode local PNGs and verify rendered pixels
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          WORLD_SMOKE_BROWSER: chrome
          PHOTO_MODE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PHOTO_PNG_QA_OUTPUT: test-results/photo-mode/png
        run: timeout --signal=TERM --kill-after=10s 240s node apps/world/tests/browser/photo-mode-png-smoke.mjs
      - name: Preserve PNG evidence shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-mode-part-png
          path: test-results/photo-mode/
          if-no-files-found: warn
          retention-days: 1

  chromium-campus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/world/tests/browser/package-lock.json
      - name: Install readable Korean glyphs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Install existing pinned browser dependencies
        working-directory: apps/world/tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise Photo Mode on the actual campus
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          WORLD_SMOKE_BROWSER: chrome
          PHOTO_MODE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PHOTO_MODE_QA_OUTPUT: test-results/photo-mode/campus
        run: timeout --signal=TERM --kill-after=10s 1560s node apps/world/tests/browser/photo-mode-campus-smoke.mjs
      - name: Preserve campus evidence shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-mode-part-campus
          path: test-results/photo-mode/
          if-no-files-found: warn
          retention-days: 1

  chromium:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - chromium-controls
      - chromium-png
      - chromium-campus
    timeout-minutes: 5
    steps:
      - name: Collect Chromium evidence shards
        if: ${{ always() }}
        uses: actions/download-artifact@v4
        with:
          pattern: photo-mode-part-*
          path: test-results/photo-mode
          merge-multiple: true
      - name: Save exact-head photo evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: photo-mode-browser-evidence
          path: test-results/photo-mode/
          if-no-files-found: error
          retention-days: 7
      - name: Require all Chromium shards
        if: ${{ always() }}
        env:
          CONTROLS_RESULT: ${{ needs.chromium-controls.result }}
          PNG_RESULT: ${{ needs.chromium-png.result }}
          CAMPUS_RESULT: ${{ needs.chromium-campus.result }}
        run: |
          test "$CONTROLS_RESULT" = "success"
          test "$PNG_RESULT" = "success"
          test "$CAMPUS_RESULT" = "success"

  ipad-webkit-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/world/tests/browser/package-lock.json
      - name: Cache Playwright WebKit
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('apps/world/tests/browser/package-lock.json') }}
      - name: Install pinned browser dependencies
        working-directory: apps/world/tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Playwright WebKit
        working-directory: apps/world/tests/browser
        run: npx playwright install --with-deps webkit
      - name: Verify boot-order ownership contract
        run: node --test apps/world/tests/world-bounds-boot-order.test.mjs
      - name: Verify iPad-class WebKit reaches Main Lobby
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
        run: timeout --signal=TERM --kill-after=10s 180s node apps/world/tests/browser/ipad-webkit-boot-smoke.mjs
