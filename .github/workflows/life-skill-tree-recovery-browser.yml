name: Life Skill tree recovery browser QA
on:
  pull_request:
    paths:
      - 'apps/world/src/life-skills/life-skill-book-*.js'
      - 'apps/world/tests/life-skill-book.test.mjs'
      - 'apps/world/styles.css'
      - 'apps/world/tests/browser/life-skill-tree-recovery-*'
      - '.github/workflows/life-skill-tree-recovery-browser.yml'
permissions:
  contents: read
concurrency:
  group: life-skill-tree-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install pinned browser dependencies
        working-directory: apps/world/tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and Korean glyph coverage
        working-directory: apps/world/tests/browser
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Verify read recovery and stale-response regressions
        run: node --test apps/world/tests/life-skill-book.test.mjs
      - name: Render offline read failure and retry flows
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          EXPECTED_LIFE_TREE_HEAD: ${{ github.event.pull_request.head.sha }}
          LIFE_TREE_QA_OUTPUT: test-results/life-skill-tree-recovery
        run: node apps/world/tests/browser/life-skill-tree-recovery-smoke.mjs
      - name: Save exact-head browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-skill-tree-recovery-${{ github.event.pull_request.head.sha }}
          path: test-results/life-skill-tree-recovery/
          if-no-files-found: error
          retention-days: 14
