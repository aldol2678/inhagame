name: ALDOL 3D Studio P1 Interaction and P0 Real Source

on:
  push:
    branches:
      - feat/aldol-3d-studio-p1-20261020
    paths:
      - tools/aldol-3d-studio-p1/**
      - .github/workflows/aldol-3d-studio-p1.yml

permissions:
  contents: read

concurrency:
  group: aldol-3d-studio-p1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p1-interaction-and-p0-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout exact branch HEAD
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: P1 pure interaction geometry and hierarchy (12 tests)
        run: |
          set -euo pipefail
          node --check tools/aldol-3d-studio-p1/web/interaction.mjs
          node --test tools/aldol-3d-studio-p1/tests/interaction.test.mjs
      - name: Verify immutable P0 candidate source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aldol-p0"
          base64 --decode tools/aldol-3d-studio-p0/ci-source.tar.gz.b64 > "$RUNNER_TEMP/aldol-p0-source.tar.gz"
          echo "5ab2d1a5825c5457799e87fe65e34ebb47fef59077d2a9aef2dcf7e30405213c  $RUNNER_TEMP/aldol-p0-source.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/aldol-p0-source.tar.gz" -C "$RUNNER_TEMP/aldol-p0"
      - name: P0 actual INHA WORLD editor source integration (8 PASS 2 SKIP)
        shell: bash
        env:
          INHA_WORLD_EDITOR_DIR: ${{ github.workspace }}/apps/world/src/editor
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/aldol-p0"
          node tests/real-integration.mjs
      - name: CI scope declaration
        run: |
          echo "This workflow proves P1 pure interaction tests and P0 real-source adapter integration."
          echo "It does NOT prove full P1 UI, P1 server, WebGL/browser E2E or official MCP SDK compliance."
