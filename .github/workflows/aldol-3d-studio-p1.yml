name: ALDOL 3D Studio P1 Full Source Integration

on:
  push:
    branches:
      - feat/aldol-3d-studio-p1-20261020
    paths:
      - tools/aldol-3d-studio-p1/**
      - .github/workflows/aldol-3d-studio-p1.yml

permissions:
  contents: read

concurrency:
  group: aldol-3d-studio-p1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p1-full-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact P1 branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct version-locked source from seven pieces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aldol-p1"
          cat tools/aldol-3d-studio-p1/transport/chunk-{00..06}.b64 | base64 --decode > "$RUNNER_TEMP/p1-core.tar.br"
          echo "9c18dd09f6310c37402fb694cb560b78dbce429ee9abf6022dc57c51f8bef5f9  $RUNNER_TEMP/p1-core.tar.br" | sha256sum --check -
          node -e "const fs=require('node:fs'),z=require('node:zlib');fs.writeFileSync(process.env.RUNNER_TEMP+'/p1-core.tar',z.brotliDecompressSync(fs.readFileSync(process.env.RUNNER_TEMP+'/p1-core.tar.br')))"
          tar -xf "$RUNNER_TEMP/p1-core.tar" -C "$RUNNER_TEMP/aldol-p1"
          cmp "$RUNNER_TEMP/aldol-p1/web/interaction.mjs" tools/aldol-3d-studio-p1/web/interaction.mjs
          cmp "$RUNNER_TEMP/aldol-p1/tests/interaction.test.mjs" tools/aldol-3d-studio-p1/tests/interaction.test.mjs
      - name: Static syntax validation
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/aldol-p1"
          npm run check
      - name: P1 candidate full mock MCP HTTP geometry regression 30 tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/aldol-p1"
          npm test
      - name: P1 WorldSceneAdapter actual INHA WORLD editor classes
        shell: bash
        env:
          INHA_WORLD_EDITOR_DIR: ${{ github.workspace }}/apps/world/src/editor
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/aldol-p1"
          npm run test:real
      - name: Explicit limitations
        run: |
          echo "No deployment, INHA WORLD modifications, external MCP registration, PlayCanvas runtime browser E2E or official MCP SDK compliance is asserted by this CI."
