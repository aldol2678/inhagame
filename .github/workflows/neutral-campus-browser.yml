name: Neutral campus building browser QA
on:
  pull_request:
    paths:
      - 'apps/world/src/neutral-campus-buildings.js'
      - 'apps/world/src/neutral-facade-materials.js'
      - 'apps/world/src/worldforge-campus-building-import.js'
      - 'apps/world/src/facility-blockout.js'
      - 'apps/world/src/facility-mesh-batch.js'
      - 'apps/world/data/reality/worldforge-campus-buildings.*.json'
      - 'apps/world/tests/neutral-campus-buildings.test.mjs'
      - 'apps/world/tests/browser/neutral-campus-buildings-*'
      - '.github/workflows/neutral-campus-browser.yml'
permissions:
  contents: read
concurrency:
  group: neutral-campus-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install pinned offline browser QA dependencies
        working-directory: apps/world/tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify geometry, colliders and existing main2 contracts
        run: node --test apps/world/tests/neutral-campus-buildings.test.mjs apps/world/tests/campus-facilities.test.mjs apps/world/tests/tml-main2-*.test.mjs
      - name: Verify real PlayCanvas mesh/material lifecycle without pixels
        run: node apps/world/tests/browser/neutral-campus-buildings-null-smoke.mjs
      - name: Render all buildings and actual campus at three viewports
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          WORLD_SMOKE_BROWSER: chrome
          WORLD_NEUTRAL_QA_OUTPUT: test-results/neutral-campus
        run: node apps/world/tests/browser/neutral-campus-buildings-smoke.mjs
      - name: Save actual Chromium frames and pixel receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neutral-campus-browser-evidence
          path: test-results/neutral-campus/
          if-no-files-found: error
          retention-days: 7
