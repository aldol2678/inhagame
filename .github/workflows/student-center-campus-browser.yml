name: Student center integrated campus browser QA
on:
  pull_request:
    paths:
      - '.github/ci/phone-surface-scope*.mjs'
      - 'apps/world/src/student-center-*.js'
      - 'apps/world/src/facility-blockout.js'
      - 'apps/world/src/campus-chunk-renderer.js'
      - 'apps/world/src/campus-layout.js'
      - 'apps/world/src/campus-facilities.js'
      - 'apps/world/src/campus-render-kit.js'
      - 'apps/world/src/campus-material-profile.js'
      - 'apps/world/src/player-controller.js'
      - 'apps/world/src/player-dimensions.js'
      - 'apps/world/src/orbit-camera-controller.js'
      - 'apps/world/src/world-collision.js'
      - 'apps/world/src/polygon-collision.js'
      - 'apps/world/src/roadview-layout.js'
      - 'apps/world/src/lobby/world-resume.js'
      - 'apps/world/src/environment/night-building-windows.js'
      - 'apps/world/src/environment/night-window-policy.js'
      - 'apps/world/src/main.js'
      - 'apps/world/campus/index.html'
      - 'apps/world/tests/student-center-*.test.mjs'
      - 'apps/world/tests/browser/student-center-*'
      - 'apps/world/tests/browser/harness.mjs'
      - 'apps/world/tests/browser/package.json'
      - 'apps/world/tests/browser/package-lock.json'
      - '.github/workflows/student-center-campus-browser.yml'
permissions:
  contents: read
concurrency:
  group: student-center-campus-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 128
      - name: Select affected browser suite (fail-closed)
        id: phone_scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_PR_TITLE: ${{ github.event.pull_request.title }}
        run: node .github/ci/phone-surface-scope.mjs >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.phone_scope.outputs.skip != 'true'
        with:
          node-version: '24.19.0'
      - name: Install existing pinned Playwright and PlayCanvas dependencies
        if: steps.phone_scope.outputs.skip != 'true'
        working-directory: apps/world/tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify student geometry and default campus controller contracts
        if: steps.phone_scope.outputs.skip != 'true'
        run: node --test apps/world/tests/student-center-candidate.test.mjs apps/world/tests/student-center-connected.test.mjs apps/world/tests/student-center-campus.test.mjs
      - name: Verify actual engine ownership without claiming rendered pixels
        if: steps.phone_scope.outputs.skip != 'true'
        run: node apps/world/tests/browser/student-center-campus-null-smoke.mjs
      - name: Render exact-head full campus and walk both directions at three sizes
        if: steps.phone_scope.outputs.skip != 'true'
        timeout-minutes: 10
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          WORLD_SMOKE_BROWSER: chrome
          WORLD_STUDENT_CAMPUS_QA_OUTPUT: test-results/student-center-campus
          EXPECTED_STUDENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: timeout --signal=TERM --kill-after=10s 570s node apps/world/tests/browser/student-center-campus-smoke.mjs
      - name: Save exact-commit frames, trusted-input and per-tick support receipts
        if: always() && steps.phone_scope.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: student-center-campus-browser-evidence
          path: test-results/student-center-campus/
          if-no-files-found: error
          retention-days: 7
