name: Daily panel focus browser QA
on:
  pull_request:
    paths:
      - 'apps/world/src/attendance/**'
      - 'apps/world/src/daily-quiz/**'
      - 'apps/world/npc-factory/quest-reward-shape.mjs'
      - 'apps/world/styles.css'
      - 'apps/world/tests/attendance.test.mjs'
      - 'apps/world/tests/daily-quiz.test.mjs'
      - 'apps/world/tests/daily-panel-focus*.test.mjs'
      - 'apps/world/tests/browser/daily-panel-focus-*'
      - 'apps/world/tests/browser/package*.json'
      - '.github/workflows/daily-panel-focus-browser.yml'
permissions:
  contents: read
concurrency:
  group: daily-panel-focus-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install pinned browser dependencies
        working-directory: apps/world/tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and Korean glyphs
        run: |
          cd apps/world/tests/browser
          npx --no-install playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify daily panel focus and account contracts
        run: node --test apps/world/tests/daily-panel-focus*.test.mjs apps/world/tests/attendance.test.mjs apps/world/tests/daily-quiz.test.mjs
      - name: Exercise native desktop, portrait and landscape controls with synthetic RPCs
        env:
          DAILY_PANEL_FOCUS_HEAD: ${{ github.event.pull_request.head.sha }}
          DAILY_PANEL_FOCUS_OUTPUT: test-results/daily-panel-focus
        run: timeout --signal=TERM --kill-after=10s 360s node apps/world/tests/browser/daily-panel-focus-smoke.mjs
      - name: Preserve exact-head source receipts and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-panel-focus-browser-evidence
          path: test-results/daily-panel-focus/
          if-no-files-found: error
          retention-days: 14
