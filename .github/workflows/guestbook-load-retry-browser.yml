name: Guestbook load retry browser QA
on:
  pull_request:
    paths:
      - 'apps/world/src/guestbook/**'
      - 'apps/world/styles.css'
      - 'apps/world/tests/guestbook*.test.mjs'
      - 'apps/world/tests/browser/guestbook-load-retry-*'
      - 'apps/world/tests/browser/package*.json'
      - '.github/workflows/guestbook-load-retry-browser.yml'
      - '.github/workflows/reusable-browser-qa.yml'
      - '.github/actions/setup-world-browser/**'
permissions:
  contents: read
concurrency:
  group: guestbook-load-retry-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  chromium:
    uses: ./.github/workflows/reusable-browser-qa.yml
    with:
      suite: guestbook-load-retry
      timeout: 10
      playwright-browser: chromium
      korean-fonts: true
      # Verify guestbook read and account contracts.
      test-command: node --test apps/world/tests/guestbook*.test.mjs
      # Exercise native keyboard and touch with synthetic reads only.
      smoke-command: >-
        GUESTBOOK_RETRY_HEAD="$QA_HEAD_SHA"
        GUESTBOOK_RETRY_OUTPUT=test-results/guestbook-load-retry
        node apps/world/tests/browser/guestbook-load-retry-smoke.mjs
      # Exact-head source hashes and screenshots.
      artifact-name: guestbook-load-retry-browser-evidence
      artifact-path: test-results/guestbook-load-retry/
      artifact-retention-days: 14
