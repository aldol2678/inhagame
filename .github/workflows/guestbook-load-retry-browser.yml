name: Guestbook load retry browser QA
on:
  pull_request:
    paths:
      - 'apps/world/src/guestbook/**'
      - 'apps/world/styles.css'
      - 'apps/world/tests/guestbook*.test.mjs'
      - 'apps/world/tests/browser/guestbook-load-retry-*'
      - 'apps/world/tests/browser/package*.json'
      - '.github/workflows/guestbook-load-retry-browser.yml'
permissions:
  contents: read
concurrency:
  group: guestbook-load-retry-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install pinned browser dependencies
        working-directory: apps/world/tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and Korean glyphs
        run: |
          cd apps/world/tests/browser
          npx --no-install playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify guestbook read and account contracts
        run: node --test apps/world/tests/guestbook*.test.mjs
      - name: Exercise native keyboard and touch with synthetic reads only
        env:
          GUESTBOOK_RETRY_HEAD: ${{ github.event.pull_request.head.sha }}
          GUESTBOOK_RETRY_OUTPUT: test-results/guestbook-load-retry
        run: node apps/world/tests/browser/guestbook-load-retry-smoke.mjs
      - name: Preserve exact-head source hashes and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guestbook-load-retry-browser-evidence
          path: test-results/guestbook-load-retry/
          if-no-files-found: error
          retention-days: 14
