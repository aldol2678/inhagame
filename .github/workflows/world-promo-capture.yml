name: World promo capture
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to capture (branch, tag, or commit)
        required: true
        default: main
      manifest:
        description: Repo-relative Promo Capture manifest path
        required: true
        default: apps/world/promo/capture-manifest.v1.json
permissions:
  contents: read
concurrency:
  group: world-promo-capture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Record exact capture head
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install pinned browser dependencies
        working-directory: apps/world/tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Promo Capture contract
        run: node --test apps/world/tests/promo-capture-contract.test.mjs
      - name: Capture deterministic real-render shots
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          WORLD_SMOKE_BROWSER: chrome
          WORLD_SMOKE_TIMEOUT_MS: '90000'
          WORLD_PROMO_OUTPUT: test-results/world-promo-capture
          EXPECTED_PROMO_HEAD: ${{ steps.source.outputs.sha }}
        run: node apps/world/tests/browser/promo-capture.mjs "${{ inputs.manifest }}"
      - name: Save clips, thumbnails and machine-readable edit index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-promo-capture-${{ steps.source.outputs.sha }}
          path: test-results/world-promo-capture/
          if-no-files-found: error
          retention-days: 14
