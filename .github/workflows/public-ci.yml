name: Public local checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # Only newer runs of the same PR supersede older runs.
  # Main pushes use a distinct run ID and are never cancelled by this policy.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tml-contract-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r apps/world/tml/contracts/v1/tools/requirements.txt
      - run: bash scripts/verify-tml-contract-v1.sh
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: |
            apps/world/tests/recast-runtime/package-lock.json
            apps/induckup/package-lock.json
      - name: Test scope detection
        run: node --test .github/ci/public-ci-scope.test.mjs
      - name: Detect verification scope
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BEFORE: ${{ github.event.before }}
        run: node .github/ci/public-ci-scope.mjs >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v3
        if: steps.scope.outputs.mode == 'full' && steps.scope.outputs.db == 'true'
        with:
          version: 2.117.0
      - run: bash scripts/public-ci.sh
        if: steps.scope.outputs.mode == 'full'
      - run: bash scripts/public-db.sh
        if: steps.scope.outputs.mode == 'full' && steps.scope.outputs.db == 'true'
      - name: Complete database-independent verification
        if: steps.scope.outputs.mode == 'full' && steps.scope.outputs.db != 'true'
        run: |
          echo "Database-independent change: local Supabase startup and integration DB suite were not required."
          echo "Public source/unit/static verification still ran in full." >> "$GITHUB_STEP_SUMMARY"
      - name: Complete documentation-only verification
        if: steps.scope.outputs.mode == 'docs'
        run: |
          echo "Documentation-only change: full verification not required."
          echo "Documentation-only verification completed; full CI and local DB steps were not needed." >> "$GITHUB_STEP_SUMMARY"
