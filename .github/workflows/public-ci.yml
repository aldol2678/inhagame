name: Public local checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # Only newer runs of the same PR supersede older runs.
  # Main pushes use a distinct run ID and are never cancelled by this policy.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      db: ${{ steps.scope.outputs.db }}
      portal_browser: ${{ steps.scope.outputs.portal_browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Test scope detection
        run: node --test .github/ci/public-ci-scope.test.mjs .github/ci/seo-only-scope.test.mjs .github/ci/phone-surface-scope.test.mjs .github/ci/phone-surface-scope-contract.test.mjs
      - name: Detect verification scope
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BEFORE: ${{ github.event.before }}
          CI_PR_TITLE: ${{ github.event.pull_request.title }}
        run: node .github/ci/public-ci-scope.mjs >> "$GITHUB_OUTPUT"

  source:
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: |
            apps/world/tests/recast-runtime/package-lock.json
            apps/induckup/package-lock.json
      - run: bash scripts/public-ci.sh

  seo:
    needs: scope
    if: needs.scope.outputs.mode == 'seo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Verify SEO metadata, canonical, robots and sitemap
        run: node --test apps/world/tests/seo-metadata.test.mjs

  database:
    needs: scope
    if: needs.scope.outputs.mode == 'full' && needs.scope.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      - run: bash scripts/public-db.sh

  portal-browser:
    needs: scope
    if: needs.scope.outputs.portal_browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Record exact portal source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p test-results/portal-layout
          git rev-parse HEAD > test-results/portal-layout/head-sha.txt
          sha256sum apps/world/index.html apps/world/hub*.css apps/world/hub.js apps/world/hub-editorial.js apps/world/game-catalog.js apps/world/data/game-catalog.json apps/world/scripts/generate-arcade-pages.mjs apps/world/tests/browser/*layout-smoke.mjs > test-results/portal-layout/source-sha256.txt
          rg --files apps/world/arcade -g "*.html" -g "*.css" -0 | sort -z | xargs -0 sha256sum >> test-results/portal-layout/source-sha256.txt
      - name: Install pinned browser and Korean glyphs
        working-directory: apps/world/tests/browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Verify offline portal layout at mobile and desktop sizes
        env:
          EVIDENCE_DIR: test-results/portal-layout
        run: |
          node apps/world/scripts/generate-arcade-pages.mjs --check
          node apps/world/tests/browser/hub-editorial-layout-smoke.mjs
          node apps/world/tests/browser/arcade-layout-smoke.mjs
      - name: Preserve exact-head portal screenshots and assertions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-layout-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/portal-layout/
          if-no-files-found: error
          retention-days: 14

  # Keep the historical required status context "verify" while the expensive
  # source and database checks execute in parallel.
  verify:
    needs: [scope, source, database, seo, portal-browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate verification result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          SEO_RESULT: ${{ needs.seo.result }}
          MODE: ${{ needs.scope.outputs.mode }}
          PORTAL_BROWSER_REQUIRED: ${{ needs.scope.outputs.portal_browser }}
          PORTAL_BROWSER_RESULT: ${{ needs.portal-browser.result }}
          DB_REQUIRED: ${{ needs.scope.outputs.db }}
        run: |
          if [[ "$SCOPE_RESULT" != "success" ]]; then
            echo "Scope detection failed: $SCOPE_RESULT"
            exit 1
          fi

          if [[ "$PORTAL_BROWSER_REQUIRED" != "true" && "$PORTAL_BROWSER_REQUIRED" != "false" ]]; then
            echo "Invalid portal browser scope: $PORTAL_BROWSER_REQUIRED"
            exit 1
          fi
          if [[ "$PORTAL_BROWSER_REQUIRED" == "true" && "$PORTAL_BROWSER_RESULT" != "success" ]]; then
            echo "Portal browser verification failed: $PORTAL_BROWSER_RESULT"
            exit 1
          fi

          case "$MODE" in
            full)
              if [[ "$SOURCE_RESULT" != "success" ]]; then
                echo "Source/unit/static verification failed: $SOURCE_RESULT"
                exit 1
              fi

              if [[ "$DB_REQUIRED" == "true" ]]; then
                if [[ "$DATABASE_RESULT" != "success" ]]; then
                  echo "Database verification failed: $DATABASE_RESULT"
                  exit 1
                fi
                echo "Full source and database verification completed successfully." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "Database-independent change: local Supabase startup and integration DB suite were not required."
                echo "Public source/unit/static verification ran in full." >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
            seo)
              if [[ "$SEO_RESULT" != "success" ]]; then
                echo "SEO-only verification failed: $SEO_RESULT"
                exit 1
              fi
              echo "Verified SEO-only change: metadata checks passed; full source and DB suites not required." >> "$GITHUB_STEP_SUMMARY"
              ;;
            docs)
              echo "Documentation-only change: full verification not required."
              echo "Documentation-only verification completed; full CI and local DB steps were not needed." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "Unexpected verification mode: '$MODE'"
              exit 1
              ;;
          esac
