name: Public local checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tml-contract-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r apps/world/tml/contracts/v1/tools/requirements.txt
      - run: bash scripts/verify-tml-contract-v1.sh
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      - run: bash scripts/public-ci.sh
      - run: bash scripts/public-db.sh
