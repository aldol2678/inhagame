name: Campus terrain browser QA
on:
  pull_request:
    paths:
      - 'apps/world/src/campus-terrain*.js'
      - 'apps/world/src/campus-chunk-renderer.js'
      - 'apps/world/tests/campus-terrain.test.mjs'
      - 'apps/world/tests/campus-terrain-diagnostic.test.mjs'
      - 'apps/world/tests/browser/campus-terrain-smoke.mjs'
      - 'apps/world/tests/browser/campus-terrain-baseline-control.mjs'
      - '.github/workflows/campus-terrain-browser.yml'
permissions:
  contents: read
concurrency:
  group: campus-terrain-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install pinned browser QA dependencies
        working-directory: apps/world/tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify ground geometry
        run: node --test apps/world/tests/campus-terrain.test.mjs apps/world/tests/campus-terrain-diagnostic.test.mjs
      - name: Reproduce original failure and repaired diagnostic on immutable main
        timeout-minutes: 14
        run: node apps/world/tests/browser/campus-terrain-baseline-control.mjs
      - name: Render candidate terrain with isolated diagnostic background
        timeout-minutes: 5
        env:
          WORLD_SMOKE_DISABLE_WEBGPU: '1'
          WORLD_SMOKE_BROWSER: chrome
          WORLD_TERRAIN_QA_OUTPUT: test-results/campus-terrain
        run: timeout --signal=TERM --kill-after=10s 270s node apps/world/tests/browser/campus-terrain-smoke.mjs
      - name: Save Chromium frames and pixel receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campus-terrain-browser-evidence
          path: test-results/campus-terrain/
          if-no-files-found: error
          retention-days: 7
