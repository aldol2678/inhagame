name: Asset canary BFCache
on:
  pull_request:
    paths:
      - 'apps/world/src/asset-canary-remote-control.js'
      - 'apps/world/src/npc-feature-flags.js'
      - 'apps/world/src/main.js'
      - 'apps/world/tests/asset-canary-remote-control.test.mjs'
      - 'apps/world/tests/browser/asset-canary-bfcache-smoke.mjs'
      - 'apps/world/tests/browser/package*.json'
      - '.github/workflows/asset-canary-bfcache.yml'
permissions:
  contents: read
jobs:
  bfcache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --prefix apps/world/tests/browser --ignore-scripts --no-audit --no-fund
      - run: cd apps/world/tests/browser && npx --no-install playwright install --with-deps --no-shell chromium
      - run: node apps/world/tests/browser/asset-canary-bfcache-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-canary-bfcache
          path: test-results/asset-canary-bfcache.json
          if-no-files-found: warn
          retention-days: 7
