name: INHA Native P0 one-shot benchmark

on:
  push:
    branches:
      - benchmark/inha-native-p0-full-20261007

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run 48/100/200 DetourCrowd benchmark
        working-directory: apps/world/tests/recast-runtime
        run: |
          npm ci --ignore-scripts
          node --test crowd-benchmark.test.mjs
