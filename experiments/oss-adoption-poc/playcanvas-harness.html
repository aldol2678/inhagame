<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=512,height=512,initial-scale=1">
  <title>INHAGAME PlayCanvas glTF compatibility harness</title>
  <style>
    html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; background: #f2f2f2; }
    canvas { display: block; width: 512px; height: 512px; }
  </style>
  <script type="importmap">
    { "imports": { "playcanvas": "/vendor/playcanvas/build/playcanvas.mjs" } }
  </script>
</head>
<body>
<canvas id="stage" width="512" height="512"></canvas>
<script type="module">
  import * as pc from "playcanvas";

  const params = new URLSearchParams(location.search);
  const assetUrl = params.get("url");
  const suppliedCamera = params.get("camera") ? JSON.parse(params.get("camera")) : null;
  const canvas = document.getElementById("stage");

  const round = value => Number(value.toFixed(8));
  const vec = value => [round(value.x), round(value.y), round(value.z)];

  function hierarchyCount(root) {
    let count = 0;
    const visit = node => {
      count += 1;
      for (const child of node.children ?? []) visit(child);
    };
    visit(root);
    return count;
  }

  function renderSummary(root) {
    const renders = root.findComponents("render");
    const meshInstances = renders.flatMap(render => render.meshInstances ?? []);
    const materials = new Set(meshInstances.map(instance => instance.material).filter(Boolean));
    return {
      entities: hierarchyCount(root),
      renderComponents: renders.length,
      meshInstances: meshInstances.length,
      materials: materials.size
    };
  }

  function boundsFor(root) {
    const renders = root.findComponents("render");
    const instances = renders.flatMap(render => render.meshInstances ?? []);
    if (!instances.length) throw new Error("no mesh instances");

    const min = new pc.Vec3(Infinity, Infinity, Infinity);
    const max = new pc.Vec3(-Infinity, -Infinity, -Infinity);
    for (const instance of instances) {
      const aabb = instance.aabb;
      const lo = aabb.getMin();
      const hi = aabb.getMax();
      min.x = Math.min(min.x, lo.x); min.y = Math.min(min.y, lo.y); min.z = Math.min(min.z, lo.z);
      max.x = Math.max(max.x, hi.x); max.y = Math.max(max.y, hi.y); max.z = Math.max(max.z, hi.z);
    }

    const center = new pc.Vec3(
      (min.x + max.x) / 2,
      (min.y + max.y) / 2,
      (min.z + max.z) / 2
    );
    const dx = max.x - center.x;
    const dy = max.y - center.y;
    const dz = max.z - center.z;
    const radius = Math.sqrt(dx * dx + dy * dy + dz * dz);
    return { min, max, center, radius };
  }

  try {
    if (!assetUrl) throw new Error("asset url required");

    const device = await pc.createGraphicsDevice(canvas, {
      deviceTypes: [pc.DEVICETYPE_WEBGL2],
      powerPreference: "high-performance",
      antialias: false,
      alpha: false
    });

    const options = new pc.AppOptions();
    options.graphicsDevice = device;
    options.componentSystems = [
      pc.RenderComponentSystem,
      pc.CameraComponentSystem,
      pc.LightComponentSystem
    ];
    options.resourceHandlers = [pc.TextureHandler, pc.ContainerHandler];

    const app = new pc.AppBase(canvas);
    app.init(options);
    app.setCanvasResolution(pc.RESOLUTION_FIXED, 512, 512);
    app.setCanvasFillMode(pc.FILLMODE_NONE, 512, 512);
    app.scene.ambientLight = new pc.Color(0.62, 0.62, 0.62);
    app.scene.exposure = 1;
    app.start();

    const light = new pc.Entity("Sun");
    light.addComponent("light", {
      type: "directional",
      color: new pc.Color(1, 1, 1),
      intensity: 2,
      castShadows: false
    });
    light.setEulerAngles(50, 35, 0);
    app.root.addChild(light);

    const camera = new pc.Entity("Camera");
    camera.addComponent("camera", {
      clearColor: new pc.Color(0.949, 0.949, 0.949),
      nearClip: 0.01,
      farClip: 10000,
      fov: 35
    });
    camera.camera.toneMapping = pc.TONEMAP_NEUTRAL;
    app.root.addChild(camera);

    const asset = await new Promise((resolve, reject) => {
      app.assets.loadFromUrl(assetUrl, "container", (error, loaded) => {
        if (error) reject(new Error(String(error)));
        else resolve(loaded);
      });
    });

    if (!asset?.resource?.instantiateRenderEntity) throw new Error("container resource unavailable");
    const model = asset.resource.instantiateRenderEntity({ castShadows: false });
    model.name = "PoCModel";
    app.root.addChild(model);
    app.root.syncHierarchy();

    const box = boundsFor(model);
    if (!Number.isFinite(box.radius) || box.radius <= 0) throw new Error("invalid model bounds");

    let target;
    if (suppliedCamera) {
      camera.setPosition(...suppliedCamera.position);
      target = new pc.Vec3(...suppliedCamera.target);
      camera.camera.nearClip = suppliedCamera.near;
      camera.camera.farClip = suppliedCamera.far;
      camera.camera.fov = suppliedCamera.fov;
    } else {
      target = box.center.clone();
      const direction = new pc.Vec3(1, 0.72, 1).normalize();
      const halfFov = (camera.camera.fov * Math.PI / 180) * 0.5;
      const distance = Math.max(0.1, (box.radius / Math.sin(halfFov)) * 1.18);
      camera.setPosition(
        target.x + direction.x * distance,
        target.y + direction.y * distance,
        target.z + direction.z * distance
      );
      camera.camera.nearClip = Math.max(0.001, distance / 1000);
      camera.camera.farClip = Math.max(100, distance * 20 + box.radius * 20);
    }
    camera.lookAt(target);
    app.root.syncHierarchy();

    await new Promise(resolve => requestAnimationFrame(resolve));
    await new Promise(resolve => requestAnimationFrame(resolve));
    app.renderNextFrame = true;
    await new Promise(resolve => requestAnimationFrame(resolve));

    window.__PC_VISUAL_META__ = {
      assetUrl,
      engineVersion: pc.version ?? null,
      renderer: device.isWebGPU ? "WebGPU" : device.isWebGL2 ? "WebGL2" : "UNKNOWN",
      bounds: {
        min: vec(box.min),
        max: vec(box.max),
        center: vec(box.center),
        radius: round(box.radius)
      },
      camera: {
        position: vec(camera.getPosition()),
        target: vec(target),
        near: round(camera.camera.nearClip),
        far: round(camera.camera.farClip),
        fov: round(camera.camera.fov)
      },
      scene: renderSummary(model)
    };
    window.__PC_VISUAL_READY__ = true;
  } catch (error) {
    window.__PC_VISUAL_ERROR__ = String(error?.stack || error);
    window.__PC_VISUAL_READY__ = false;
  }
</script>
</body>
</html>
