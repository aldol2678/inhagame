<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=512,height=512,initial-scale=1">
  <title>INHAGAME glTF visual regression harness</title>
  <style>
    html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; background: #f2f2f2; }
    canvas { display: block; width: 512px; height: 512px; }
  </style>
  <script type="importmap">
    { "imports": { "three": "/vendor/three/build/three.module.js" } }
  </script>
</head>
<body>
<canvas id="stage" width="512" height="512"></canvas>
<script type="module">
  import * as THREE from "three";
  import { GLTFLoader } from "/vendor/three/examples/jsm/loaders/GLTFLoader.js";

  const params = new URLSearchParams(location.search);
  const assetUrl = params.get("url");
  const suppliedCamera = params.get("camera") ? JSON.parse(params.get("camera")) : null;

  const canvas = document.getElementById("stage");
  const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: false,
    alpha: false,
    preserveDrawingBuffer: true,
    powerPreference: "high-performance"
  });
  renderer.setPixelRatio(1);
  renderer.setSize(512, 512, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.setClearColor(0xf2f2f2, 1);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf2f2f2);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 2.0));
  const key = new THREE.DirectionalLight(0xffffff, 2.5);
  key.position.set(4, 7, 5);
  scene.add(key);

  const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 10000);
  const loader = new GLTFLoader();

  function roundVec3(v) {
    return [v.x, v.y, v.z].map(value => Number(value.toFixed(8)));
  }

  try {
    if (!assetUrl) throw new Error("asset url required");
    const gltf = await loader.loadAsync(assetUrl);
    scene.add(gltf.scene);
    gltf.scene.updateMatrixWorld(true);

    const box = new THREE.Box3().setFromObject(gltf.scene);
    const sphere = box.getBoundingSphere(new THREE.Sphere());
    if (!Number.isFinite(sphere.radius) || sphere.radius <= 0) throw new Error("invalid model bounds");

    let target;
    if (suppliedCamera) {
      camera.position.fromArray(suppliedCamera.position);
      target = new THREE.Vector3().fromArray(suppliedCamera.target);
      camera.near = suppliedCamera.near;
      camera.far = suppliedCamera.far;
      camera.fov = suppliedCamera.fov;
      camera.updateProjectionMatrix();
    } else {
      target = sphere.center.clone();
      const direction = new THREE.Vector3(1, 0.72, 1).normalize();
      const halfFov = THREE.MathUtils.degToRad(camera.fov * 0.5);
      const distance = Math.max(0.1, (sphere.radius / Math.sin(halfFov)) * 1.18);
      camera.position.copy(target).addScaledVector(direction, distance);
      camera.near = Math.max(0.001, distance / 1000);
      camera.far = Math.max(100, distance * 20 + sphere.radius * 20);
      camera.updateProjectionMatrix();
    }

    camera.lookAt(target);
    scene.updateMatrixWorld(true);
    renderer.render(scene, camera);
    await new Promise(resolve => requestAnimationFrame(resolve));
    renderer.render(scene, camera);

    window.__VISUAL_META__ = {
      assetUrl,
      bounds: {
        min: roundVec3(box.min),
        max: roundVec3(box.max),
        center: roundVec3(sphere.center),
        radius: Number(sphere.radius.toFixed(8))
      },
      camera: {
        position: roundVec3(camera.position),
        target: roundVec3(target),
        near: Number(camera.near.toFixed(8)),
        far: Number(camera.far.toFixed(8)),
        fov: Number(camera.fov.toFixed(8))
      },
      scene: {
        animations: gltf.animations.length
      }
    };
    window.__VISUAL_READY__ = true;
  } catch (error) {
    window.__VISUAL_ERROR__ = String(error?.stack || error);
    window.__VISUAL_READY__ = false;
  }
</script>
</body>
</html>
