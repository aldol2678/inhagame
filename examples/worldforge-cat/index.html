<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>WorldForge Cat | E1</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#142231;color:#fff;font:16px system-ui,sans-serif;touch-action:none}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    #hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:14px;padding:12px;background:#102030cf;border-radius:12px;pointer-events:none}
    #hud strong{display:block;font-size:17px}#hud span{display:block;margin-top:4px;font-size:12px;color:#d9e9f4}
    #status{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:14px;background:#14283bdb;padding:8px 10px;border-radius:9px;font-size:12px}
    #mobile{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));right:16px;display:grid;grid-template-columns:repeat(3,56px);gap:5px}
    #mobile button{border:1px solid #ffffff70;background:#12283ad9;color:white;border-radius:12px;height:54px;font-size:23px;touch-action:none;user-select:none}
    #mobile button[data-key="run"]{font-size:13px}
    #mobile button.active{background:#2f8cbb}#mobile button:active{background:#336e8f}
  </style>
</head>
<body>
  <canvas id="game" aria-label="WorldForge 3D scene"></canvas>
  <div id="hud"><strong>🐈 WorldForge Cat · E1</strong><span>WASD / 방향키 이동 · Shift 달리기 토글</span></div>
  <div id="status" role="status">엔진 준비 중…</div>
  <div id="mobile" aria-label="터치 방향키">
    <div></div><button data-key="up" aria-label="앞으로">▲</button><div></div>
    <button data-key="left" aria-label="왼쪽">◀</button><button data-key="run" aria-label="달리기 토글">RUN</button><button data-key="right" aria-label="오른쪽">▶</button>
    <div></div><button data-key="down" aria-label="뒤로">▼</button><div></div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
