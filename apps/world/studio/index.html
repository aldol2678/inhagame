<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1118">
  <title>INHA Studio · S3.4</title>
  <link rel="stylesheet" href="/studio/studio.css">
</head>
<body>
  <main id="studio-app" class="studio-app" data-layout="desktop">
    <header class="studio-topbar">
      <div class="studio-brand">
        <span class="studio-brand-mark">IW</span>
        <div><strong>INHA STUDIO</strong><span>S3.4 · Asset Registry</span></div>
      </div>
      <div class="studio-project">
        <span>PROJECT</span>
        <strong>INHA WORLD</strong>
      </div>
      <div class="studio-actions">
        <button id="studio-content-toggle" class="studio-mobile-toggle" type="button" aria-pressed="false">Content</button>
        <button id="studio-inspector-toggle" class="studio-mobile-toggle" type="button" aria-pressed="false">Inspector</button>
        <button id="studio-preview" type="button" disabled title="활성 모듈 Preview">▶ Preview</button>
        <button id="studio-save" class="primary" type="button" disabled title="활성 모듈 저장">Save</button>
      </div>
    </header>

    <div class="studio-workspace">
      <nav id="studio-modules" class="studio-modules" aria-label="Studio modules"></nav>

      <aside id="studio-content" class="studio-content" data-open="false" aria-label="Content Browser">
        <div class="studio-panel-heading"><span>CONTENT</span><strong id="studio-content-title">World</strong></div>
        <div id="studio-content-body" class="studio-panel-body"></div>
      </aside>

      <section id="studio-viewport" class="studio-viewport" aria-label="Studio viewport">
        <div class="studio-viewport-head">
          <span id="studio-viewport-label">World</span>
          <span id="studio-viewport-mode">S1 · Hosted World Editor</span>
        </div>
        <div id="studio-viewport-body" class="studio-viewport-body"></div>
      </section>

      <aside id="studio-inspector" class="studio-inspector" data-open="false" aria-label="Inspector">
        <div class="studio-panel-heading"><span>INSPECTOR</span><strong id="studio-inspector-title">Module</strong></div>
        <div id="studio-inspector-body" class="studio-panel-body"></div>
      </aside>
    </div>

    <section id="studio-bottom-panel" class="studio-bottom-panel">
      <div class="studio-bottom-tabs" role="tablist" aria-label="Studio bottom panels">
        <button type="button" data-bottom-tab="console" role="tab" aria-selected="true">Console</button>
        <button type="button" data-bottom-tab="validation" role="tab" aria-selected="false">Validation</button>
        <button type="button" data-bottom-tab="history" role="tab" aria-selected="false">History</button>
      </div>
      <div id="studio-bottom-body" class="studio-bottom-body" role="tabpanel"></div>
    </section>

    <footer class="studio-statusbar">
      <div><span class="studio-status-dot"></span><strong>Studio</strong><span>S3.4</span></div>
      <div><span id="studio-module-count">0 modules</span><span id="studio-layout-status">desktop</span></div>
    </footer>
  </main>
  <script type="module" src="/src/studio/studio-app.js"></script>
</body>
</html>
