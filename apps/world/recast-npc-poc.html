<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101722">
  <title>INHA WORLD · Recast NPC Navigation PoC</title>
  <style>
    body{margin:0;background:#101722;color:#eef7f5;font:15px/1.55 system-ui,sans-serif}
    main{max-width:880px;margin:0 auto;padding:32px 20px 64px}
    h1{font-size:28px;margin:0 0 8px}
    p{color:#b9cfca}
    code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    pre{white-space:pre-wrap;word-break:break-word;background:#0a1118;border:1px solid #34515c;border-radius:12px;padding:16px;overflow:auto}
    .tag{display:inline-block;padding:3px 8px;border:1px solid #6ba49b;border-radius:999px;color:#bff2dd;font-size:12px}
  </style>
</head>
<body>
  <main>
    <span class="tag">SHADOW POC · NO PRODUCTION MUTATION</span>
    <h1>Recast NPC Navigation</h1>
    <p>현행 NPC population, schedule, walkability 데이터를 그대로 읽어 기존 경로와 Recast &amp; Detour 경로를 비교합니다. 본 페이지는 프로덕션 NPC 이동기를 변경하지 않습니다.</p>
    <p id="recast-poc-status" role="status">PoC 준비 중…</p>
    <p><button id="recast-poc-cancel" type="button">평가 취소</button>
      <button id="recast-poc-restart" type="button">다시 평가</button></p>
    <pre id="recast-poc-output" aria-live="polite">loading</pre>
  </main>
  <script type="module" src="/recast-npc-poc.mjs"></script>
</body>
</html>
