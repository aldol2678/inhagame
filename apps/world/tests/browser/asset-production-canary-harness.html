<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=512,height=512,initial-scale=1">
  <title>INHAGAME production asset canary harness</title>
  <script type="importmap">
    { "imports": { "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas@2.22.4/build/playcanvas.mjs" } }
  </script>
</head>
<body>
<canvas id="stage" width="512" height="512"></canvas>
<script type="module">
  import * as pc from "playcanvas";
  import { createCharacter } from "/src/character-model.js";
  import { assetCanarySelected } from "/src/asset-authority-canary.js";
  import {
    ASSET_PRODUCTION_CANARY_PERCENTAGE,
    createProductionAssetCanary
  } from "/src/asset-production-canary.js";

  const mode = new URLSearchParams(location.search).get("mode") || "selected";
  const canvas = document.getElementById("stage");

  function cohortKey(wanted) {
    for (let index = 0; index < 1_000_000; index += 1) {
      const key = "production-browser-" + index;
      if (assetCanarySelected(key, ASSET_PRODUCTION_CANARY_PERCENTAGE) === wanted) return key;
    }
    throw new Error("cohort fixture not found");
  }

  try {
    const device = await pc.createGraphicsDevice(canvas, {
      deviceTypes: [pc.DEVICETYPE_WEBGL2],
      powerPreference: "high-performance",
      antialias: false
    });

    const options = new pc.AppOptions();
    options.graphicsDevice = device;
    options.componentSystems = [pc.RenderComponentSystem, pc.CameraComponentSystem, pc.LightComponentSystem];
    options.resourceHandlers = [pc.TextureHandler, pc.ContainerHandler];

    const app = new pc.AppBase(canvas);
    app.init(options);
    app.start();

    const subjectKey = cohortKey(true);
    const production = createProductionAssetCanary({
      app,
      enabled: mode !== "control",
      subjectKeyOverride: subjectKey
    });

    const player = new pc.Entity("ProductionCanaryPlayer");
    app.root.addChild(player);

    const character = createCharacter(app, player, {
      assetCanary: production.canary,
      assetCanarySubjectKey: production.subjectKey
    });

    const modelState = await character.ready;
    const before = {
      modelState,
      selected: production.selected,
      production: production.status(),
      character: character.assetCanary,
      visualAttached: Boolean(player.findByName("Induck_GLB_Visual"))
    };

    let rollback = null;
    if (mode === "rollback") {
      rollback = character.rollbackAssetCanary("HARNESS_PRODUCTION_ROLLBACK");
    }

    window.__ASSET_PRODUCTION_CANARY_HARNESS__ = {
      ready: true,
      mode,
      renderer: device.isWebGL2 ? "WebGL2" : device.isWebGPU ? "WebGPU" : "UNKNOWN",
      before,
      after: {
        modelState: character.modelState,
        production: production.status(),
        character: character.assetCanary,
        visualAttached: Boolean(player.findByName("Induck_GLB_Visual"))
      },
      rollback
    };
  } catch (error) {
    window.__ASSET_PRODUCTION_CANARY_HARNESS__ = {
      ready: false,
      mode,
      error: String(error?.stack || error)
    };
  }
</script>
</body>
</html>
