<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Starter furniture · disposable database acceptance</title>
<script type="importmap">{"imports":{"playcanvas":"https://cdn.jsdelivr.net/npm/playcanvas@2.22.4/build/playcanvas.mjs"}}</script>
<link rel="stylesheet" href="/styles.css">
<style>
  body{margin:0;background:#19302d}#starter-stage{display:block;position:fixed;inset:0;width:100%;height:100%}
  #starter-tools{position:fixed;top:8px;left:8px;z-index:64;display:flex;gap:6px;max-width:calc(100vw - 16px);flex-wrap:wrap}
  #starter-tools button{min-height:44px;padding:8px 12px;background:#19332fe8;color:white;border:1px solid #d9c399;border-radius:8px}
  #context-action{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 24px);min-height:48px;z-index:64}
  #starter-shop{z-index:110}.starter-caption{position:fixed;right:8px;top:8px;color:#fff;background:#19332fcc;padding:5px;z-index:63;font:11px system-ui;pointer-events:none}
  @media(max-width:600px){.starter-caption{top:auto;bottom:4px}.shop-panel{max-width:calc(100vw - 16px)}}
</style></head><body>
<canvas id="starter-stage"></canvas>
<nav id="starter-tools" aria-label="QA room navigation"><button id="starter-lobby">생활관 로비</button><button id="starter-room">내 방</button><button id="starter-decorate" hidden>꾸미기</button></nav>
<span class="starter-caption">격리 DB · 실제 가구/캐릭터 모듈</span>
<button id="context-action" hidden></button>
<section id="starter-shop" class="profile-panel shop-panel" role="dialog" aria-modal="true" aria-labelledby="shop-panel-title" hidden></section>
<script type="module" src="./starter-furniture-fixture.mjs"></script>
</body></html>
