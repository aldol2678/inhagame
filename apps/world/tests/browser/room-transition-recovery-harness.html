<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Room transition recovery — offline QA</title>
<script type="importmap">{"imports":{"playcanvas":"https://cdn.jsdelivr.net/npm/playcanvas@2.22.4/build/playcanvas.mjs"}}</script><link rel="stylesheet" href="/styles.css">
<style>body{font:14px/1.4 "Noto Sans CJK KR",system-ui;color:#f1f5f9}#stage{position:fixed;inset:0;width:100%;height:100%;display:block}#qa-panel{position:fixed;z-index:61;left:12px;right:12px;top:12px;padding:12px;border-radius:12px;background:#122536ed;max-width:600px;border:1px solid #9cbedb55}#qa-panel h1{font-size:15px;margin:0 0 4px}#qa-panel p{margin:4px 0;font-size:12px}#qa-buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}#qa-buttons button{min-height:40px;padding:8px 12px;border-radius:8px;background:#276d89;color:white;border:1px solid #a9d5e5}#qa-buttons button:disabled{opacity:.45}#qa-message{padding:8px;background:#203e52;border-radius:8px;color:#ffe7a8}#qa-state{font-variant-numeric:tabular-nums;color:#c4dfe7}@media(max-width:400px){#qa-panel{left:8px;right:8px;top:8px;padding:9px}#qa-panel h1{font-size:13px}#qa-buttons{gap:4px}#qa-buttons button{padding:7px 8px;font-size:12px}}#joystick{display:block!important;z-index:62}#qa-touch-actions{position:fixed;bottom:18px;right:16px;z-index:62;display:flex;gap:8px}#qa-touch-actions button{min-height:44px;padding:8px;border-radius:8px;background:#203e52;color:white;border:1px solid #afdae5}</style></head><body>
<canvas id="stage"></canvas><div id="space-fade" class="space-fade" aria-hidden="true" hidden></div>
<section id="qa-panel"><h1>방 전환 실패 복구 · 오프라인 검증</h1><p>실제 전환·입력·방 렌더러 / 합성 캠퍼스·캐릭터 / 선택형 장식 에셋 제외</p><p id="qa-state">시작 중…</p><p id="qa-message" role="status">입장 → 실패 복구 → 재시도를 확인합니다</p><div id="qa-buttons"><button id="qa-enter">동아리방 입장</button><button id="qa-lobby">생활관 입장</button><button id="qa-personal">내 방 입장</button><button id="qa-exit">나가기</button></div></section>
<div id="joystick" aria-label="이동 조이스틱"><div id="joystick-knob"></div></div><div id="qa-touch-actions"><button id="jump">점프</button><button id="run">달리기</button></div>
<script type="module" src="./room-transition-recovery-fixture.mjs"></script></body></html>
