<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=512,height=512,initial-scale=1">
  <title>INHAGAME asset optimization shadow consumer harness</title>
  <script type="importmap">
    { "imports": { "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas@2.22.4/build/playcanvas.mjs" } }
  </script>
</head>
<body>
<canvas id="stage" width="512" height="512"></canvas>
<script type="module">
  import * as pc from "playcanvas";
  import { createAssetOptimizationShadow } from "/src/asset-optimization-shadow.js";
  import { createEquipmentModelLoader } from "/src/appearance/equipment-asset-loader.js";
  import { createPlayCanvasRuntimeContext } from "/src/runtime-adapter/playcanvas-context.js";

  const canvas = document.getElementById("stage");

  function loadContainer(app, url) {
    return new Promise((resolve, reject) => {
      app.assets.loadFromUrl(url, "container", (error, asset) => {
        if (error || !asset?.resource) reject(error || new Error("asset unavailable: " + url));
        else resolve(asset);
      });
    });
  }

  function attach(asset, name, root) {
    const entity = asset.resource.instantiateRenderEntity({ castShadows: false, receiveShadows: false });
    entity.name = name;
    root.addChild(entity);
    return entity;
  }

  function renderShape(entity) {
    const renders = entity?.findComponents?.("render") ?? [];
    const meshInstances = renders.flatMap(render => render?.meshInstances ?? []);
    return {
      renderComponents: renders.length,
      meshInstances: meshInstances.length,
      materials: new Set(meshInstances.map(instance => instance.material).filter(Boolean)).size
    };
  }

  try {
    const device = await pc.createGraphicsDevice(canvas, {
      deviceTypes: [pc.DEVICETYPE_WEBGL2],
      powerPreference: "high-performance",
      antialias: false
    });
    const options = new pc.AppOptions();
    options.graphicsDevice = device;
    options.componentSystems = [pc.RenderComponentSystem, pc.CameraComponentSystem, pc.LightComponentSystem];
    options.resourceHandlers = [pc.TextureHandler, pc.ContainerHandler];

    const app = new pc.AppBase(canvas);
    app.init(options);
    app.start();

    const enabled = new URLSearchParams(location.search).get("shadow") === "1";
    const shadow = createAssetOptimizationShadow({ app, enabled });

    const duckAsset = await loadContainer(app, "/assets/induck-v3.glb");
    const duck = attach(duckAsset, "CanonicalDuck", app.root);
    await shadow.observeResource("/assets/induck-v3.glb", duckAsset, { consumer: "character-duck-harness" });

    const dragonAsset = await loadContainer(app, "/assets/annyongi-flight-v1.glb");
    const dragon = attach(dragonAsset, "CanonicalDragon", app.root);
    await shadow.observeResource("/assets/annyongi-flight-v1.glb", dragonAsset, { consumer: "character-flight-harness" });

    const equipmentLoader = createEquipmentModelLoader({ app, assetShadow: shadow });
    const cap = await equipmentLoader("equipment.head.induck_cap.v1");
    cap.name = "CanonicalCap";
    app.root.addChild(cap);
    const backpack = await equipmentLoader("equipment.back.induck_backpack.v1");
    backpack.name = "CanonicalBackpack";
    app.root.addChild(backpack);
    const hoodie = await equipmentLoader("equipment.top.induck_hoodie.v1");
    hoodie.name = "CanonicalHoodie";
    app.root.addChild(hoodie);

    const runtimeContext = createPlayCanvasRuntimeContext({ app, parent: app.root, assetShadow: shadow });
    const buildingAsset = await runtimeContext.loadAsset("/assets/p0-qa-building.glb");
    const building = runtimeContext.createRenderable(buildingAsset, {
      visible: true, castShadow: false, receiveShadow: false
    });
    building.name = "CanonicalBuilding";
    app.root.addChild(building);

    const status = await shadow.whenIdle();
    const entities = { duck, dragon, cap, backpack, hoodie, building };

    window.__ASSET_SHADOW_HARNESS__ = {
      ready: true,
      renderer: device.isWebGL2 ? "WebGL2" : device.isWebGPU ? "WebGPU" : "UNKNOWN",
      canonicalAttached: Object.fromEntries(
        Object.entries(entities).map(([key, entity]) => [key, entity.parent === app.root])
      ),
      canonicalShape: Object.fromEntries(
        Object.entries(entities).map(([key, entity]) => [key, renderShape(entity)])
      ),
      semanticPivots: {
        duck: ["DuckWing_L", "DuckWing_R", "DuckLeg_L", "DuckLeg_R"].every(name => Boolean(duck.findByName(name))),
        dragon: ["DragonWing_L", "DragonWing_R"].every(name => Boolean(dragon.findByName(name)))
      },
      status
    };
  } catch (error) {
    window.__ASSET_SHADOW_HARNESS__ = { ready: false, error: String(error?.stack || error) };
  }
</script>
</body>
</html>
