    return [campus.renderer.base,handle.near,handle.detail].map((root,i)=>root.findByName(`${id}_presentation_${tiers[i]}`));
  }
  function campusVisibility(id,visible) { for(const owner of campusOwners(id))owner.enabled=visible; }
  async function campusView(id='bldg_01') {
    document.getElementById('label').textContent=`Actual campus · ${id==='bldg_01'?'Main Hall':'Jeongseok'}\nBounds-fitted diagnostic camera`;
    device.resizeCanvas(canvas.clientWidth,canvas.clientHeight);device.updateClientRect();previous=null;
    const points=campusOwners(id).flatMap(corners).map(([x,y,z])=>[x,y,-z]);
    const fit=photoLandmarkView(id,canvas.width/canvas.height,{points});
    camera.setPosition(fit.position[0],fit.position[1],-fit.position[2]);camera.lookAt(fit.target[0],fit.target[1],-fit.target[2]);
    await waitForDiagnosticFrame(app);
    const projected=points.map(([x,y,z])=>camera.camera.worldToScreen(new pc.Vec3(x,y,-z)));
    const a=document.querySelector('aside').getBoundingClientRect(),c=canvas.getBoundingClientRect();
    return {width:canvas.width,height:canvas.height,reflection:campus.root.worldScaleSign,points:points.length,minDepth:Math.min(...projected.map(p=>p.z)),
      minX:Math.min(...projected.map(p=>p.x/canvas.width)),maxX:Math.max(...projected.map(p=>p.x/canvas.width)),
      minY:Math.min(...projected.map(p=>p.y/canvas.height)),maxY:Math.max(...projected.map(p=>p.y/canvas.height)),captionOverlapsCanvas:a.bottom>c.top+.5};
  }
  function disposeCampus() {
    for(const handle of campus.handles) campus.renderer.destroy(handle);
    const fadesAfterDestroy=campus.renderer.fades.size;
    campus.root.destroy();campus=null;world.enabled=true;
    return {fadesAfterDestroy};
  }
  Object.assign(qa,{view,stats,framing,pixels,diagnosticEvidence,lifecycle,campusLifecycle,campusView,campusVisibility,disposeCampus});
  app.start(); view(); qa.ready = true;
} catch (error) { qa.error = error.stack || String(error); throw error; }
