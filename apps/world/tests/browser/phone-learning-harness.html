<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phone learning isolated QA</title><link rel="stylesheet" href="/phone.css"><link rel="stylesheet" href="/learning.css"></head>
<body><div id="application">World input fixture</div><button id="phone-toggle">Phone</button><section id="daily" hidden>Existing Daily Quiz surface (test double)</section>
<script type="module">
import {createSmartphone} from '/src/phone/smartphone.js';
import {createInputFocusManager} from '/src/input/input-focus-manager.js';
import {createLearningCatalog} from '/src/learning/learning-content.js';
import {createLearningController} from '/src/learning/learning-controller.js';
import {learningFixture} from '/tests/support/learning-fixture.mjs';
const focus=createInputFocusManager();let phone,dailyOpens=0,failNext=false;
const realDoc=document;
const testDoc={createElement(...args){if(failNext){failNext=false;throw Error('INJECTED_RENDER_FAILURE');}return realDoc.createElement(...args);}};
const learning=createLearningController({content:createLearningCatalog(learningFixture()),doc:testDoc,onDailyQuiz:()=>phone.launch('daily-quiz')});
const daily=document.getElementById('daily');
const quizPanel={setOpen(open){daily.hidden=!open;if(open)dailyOpens++;}};
phone=createSmartphone({inputFocus:focus,learning,photoMode:{subscribe:()=>()=>{}},getMap:()=>null,getSettings:()=>null,getClient:()=>null,getIdentity:()=>null,
 getProgression:()=>null,toggle:document.getElementById('phone-toggle'),dailyQuizElement:daily,getDailyQuizPanel:()=>quizPanel});
phone.setAccount('11111111-1111-4111-8111-111111111111');
window.fixture={phone,learning,focus,get dailyOpens(){return dailyOpens;},failRender(){failNext=true;},
 switchAccount(id){phone.setAccount(id);},snapshot(){return {phone:phone.status(),learning:learning.snapshot(),world:focus.can('WORLD_ACTION')};}};
</script></body></html>
