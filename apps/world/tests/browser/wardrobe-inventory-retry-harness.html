<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wardrobe inventory retry · offline fixture</title>
  <link rel="stylesheet" href="../../styles.css">
  <style>
    body { margin: 0; padding: 24px; background: #102334; color: #eef8ff; font: 16px sans-serif; }
    .shop-panel-body { max-height: 320px; }
  </style>
</head>
<body>
  <p>Offline synthetic inventory responses. Real wardrobe and read clients. No account, backend or writes.</p>
  <button id="opener" type="button">옷장 열기</button>
  <button id="outside" type="button">다른 화면</button>
  <section id="wardrobe" class="profile-panel shop-panel inventory-panel wardrobe-panel" role="dialog" aria-modal="true" aria-labelledby="wardrobe-panel-title" hidden></section>
  <script type="module">
    import { createWardrobePanel } from '../../src/appearance/wardrobe-panel.js';
    import { createInventoryClient, INVENTORY_RPC } from '../../src/inventory/inventory-client.js';
    import { createLoadoutClient, APPEARANCE_SLOTS, LOADOUT_READ_RPC } from '../../src/appearance/loadout-client.js';
    const A = '11111111-1111-4111-8111-111111111111';
    const B = '22222222-2222-4222-8222-222222222222';
    const time = '2026-09-28T07:00:00+00:00';
    const calls = [], pending = [], events = [];
    const own = itemId => ({ itemId, quantity: 1, acquiredAt: time, updatedAt: time, sourceType: 'SHOP', sourceRef: 'fixture', eventId: null, catalogStatus: 'ACTIVE' });
    const success = itemId => ({ data: { items: [own(itemId)] }, error: null });
    const failure = { data: null, error: { message: 'SYNTHETIC_INVENTORY_UNAVAILABLE' } };
    let mode = 'error';
    const client = { rpc(fn) {
      calls.push(fn);
      if (fn === INVENTORY_RPC) {
        if (mode === 'hold') return new Promise(resolve => pending.push(resolve));
        return Promise.resolve(mode === 'error' ? failure : success('head.inha_cap'));
      }
      if (fn === LOADOUT_READ_RPC) {
        const slot = loadout.accountId === A ? 'HEAD' : 'TOP';
        const itemId = loadout.accountId === A ? 'head.inha_cap' : 'top.inha_basic';
        return Promise.resolve({ data: { slots: Object.fromEntries(APPEARANCE_SLOTS.map(s => [s,
          s === slot ? { itemId, catalogStatus: 'ACTIVE', equippedAt: time } : null])) }, error: null });
      }
      throw new Error(`Writes forbidden in fixture: ${fn}`);
    } };
    const inventory = createInventoryClient({ getClient: () => client });
    const loadout = createLoadoutClient({ getClient: () => client });
    const ui = createWardrobePanel({ panel: document.getElementById('wardrobe'), inventory, loadout });
    document.getElementById('opener').addEventListener('click', () => ui.setOpen(true));
    for (const type of ['keydown', 'click', 'pointerdown']) document.addEventListener(type, event => {
      events.push({ type, code: event.code, trusted: event.isTrusted, pointerType: event.pointerType });
    }, true);
    await Promise.all([inventory.setAccount(A), loadout.setAccount(A)]);
    window.__WARDROBE_RETRY__ = {
      calls, events, ui,
      hold() { mode = 'hold'; },
      async switchAccount(account) {
        mode = 'error';
        await Promise.all([inventory.setAccount(account === 'B' ? B : null), loadout.setAccount(account === 'B' ? B : null)]);
      },
      settle(index, succeeded, itemId = 'head.inha_cap') {
        if (!pending[index]) throw new Error(`No pending read ${index}`);
        pending[index](succeeded ? success(itemId) : failure);
      },
      snapshot: () => ({ inventoryReads: calls.filter(fn => fn === INVENTORY_RPC).length,
        loadoutReads: calls.filter(fn => fn === LOADOUT_READ_RPC).length, pending: pending.length,
        writes: calls.filter(fn => fn !== INVENTORY_RPC && fn !== LOADOUT_READ_RPC), open: ui.open })
    };
    document.getElementById('opener').focus();
  </script>
</body>
</html>
