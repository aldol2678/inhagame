<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="/phone.css">
<title>Phone Messages isolated browser QA</title></head>
<body style="margin:0;background:#102333;color:white">
<div class="smartphone" style="position:relative;min-height:100dvh">
 <div class="smartphone-frame" style="height:min(720px,95dvh)">
  <div class="smartphone-statusbar">INHA WORLD · QA</div>
  <header class="smartphone-header"><h2>메시지 통합 검증</h2></header>
  <main class="smartphone-content" id="host"></main>
  <footer class="smartphone-footer"><button id="fixture-close">닫기</button></footer>
 </div>
</div>
<script type="module">
import {createPhoneMessages} from '/src/phone/phone-messages.js';
const A='11111111-1111-4111-8111-111111111111';
const B='22222222-2222-4222-8222-222222222222';
const TARGET='33333333-3333-4333-8333-333333333333';
const CONVERSATION='44444444-4444-4444-8444-444444444444';
const DATE='2026-10-12T03:00:00.000Z';
let active=A, held=null, delayList=false, counter=0;
const calls=[];
const other={userId:TARGET,nickname:'검증 플레이어',available:true,inhaVerified:true,title:'캠퍼스 회원',avatar:null};
const state={
 [A]:{unread:2,archived:false,blocked:false,messages:[{id:'msg-1',senderId:TARGET,body:'안뇽! 캠퍼스에서 만나!',deleted:false,createdAt:DATE}]},
 [B]:{unread:0,archived:false,blocked:false,messages:[]}
};
function payload(account,name,args={}) {
 const record=state[account];
 if(name==='get_my_hub_unread_count_v1')return record.unread;
 if(name==='get_my_hub_conversations_v1')return record.archived||!record.messages.length?[]:[{
  conversationId:CONVERSATION,other,unreadCount:record.unread,blockedByMe:record.blocked,updatedAt:DATE,
  lastMessage:record.messages.at(-1)
 }];
 if(name==='get_hub_messages_v1')return {conversationId:args.p_conversation,messages:record.messages};
 if(name==='mark_hub_conversation_read_v1'){record.unread=0;return {ok:true};}
 if(name==='get_world_public_profile')return {...other,relationship:record.blocked?'blocked_by_me':'friends'};
 if(name==='send_hub_message_v1'){
  if(record.blocked)return {__error:'NOT_ALLOWED'};
  record.messages.push({id:'sent-'+(++counter),senderId:account,body:args.p_body,deleted:false,createdAt:DATE});
  record.archived=false;return {ok:true};
 }
 if(name==='report_hub_message_v1')return {ok:true};
 if(name==='block_world_user'){record.blocked=true;return {ok:true};}
 if(name==='archive_hub_conversation_v1'){record.archived=true;return {ok:true};}
 return {__error:'ACCOUNT_UNAVAILABLE'};
}
const rpc=async(name,args)=>{
 const account=active;calls.push({account,name,args});
 if(name==='get_my_hub_conversations_v1' && delayList && account===A){
  delayList=false;
  return new Promise(resolve=>{held=()=>resolve({data:payload(account,name,args)});});
 }
 const data=payload(account,name,args);
 return data?.__error ? {error:{message:data.__error}} : {data};
};
const instance=createPhoneMessages({getClient:()=>({rpc}),onUnread:count=>{document.body.dataset.unread=String(count);}});
instance.setAccount(A);
const host=document.getElementById('host');
window.fixture=Object.freeze({
 A,B,TARGET,CONVERSATION,
 open(params={}){instance.activate(params);instance.mount(host);},
 close(){instance.close();host.replaceChildren();},
 switchAccount(id){active=id;instance.setAccount(id);},
 deferNextList(){delayList=true;},
 release(){held?.();held=null;},
 get holding(){return Boolean(held);},
 get calls(){return [...calls];},
 get snapshot(){return instance.status();},
 get model(){return state;}
});
document.getElementById('fixture-close').addEventListener('click',()=>window.fixture.close());
</script></body></html>
