<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d2739">
  <title>나의 업적 · INHAGAME</title>
  <link rel="stylesheet" href="/hub.css">
  <link rel="stylesheet" href="/achievements/achievements.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script defer src="/api/public-supabase-config"></script>
  <script defer src="/achievements/achievements.js"></script>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="/">INHA<span>GAME</span> 🦆</a>
      <a class="achievements-back" href="/profile">← 내 프로필</a>
    </div>
  </header>
  <main class="main achievements-main">
    <span class="tag">INHAGAME ID · P2</span>
    <h1>나의 업적</h1>
    <p class="lead">계정에 남긴 기록으로 획득한 업적을 확인해요.</p>
    <p id="achievement-status" role="status" aria-live="polite">계정 상태를 확인하는 중…</p>
    <button id="achievement-retry" class="secondary" type="button" hidden>다시 시도</button>
    <div id="achievement-login" class="card" hidden>
      <h2>로그인이 필요해요</h2>
      <p>허브에서 기존 INHAGAME 계정으로 로그인해 주세요.</p>
      <a class="primary" href="/#account">허브에서 로그인 →</a>
    </div>
    <div id="achievement-content" hidden>
      <section class="card achievements-summary" aria-label="획득 현황">
        <strong id="achievement-count"></strong>
        <span>획득한 업적</span>
      </section>
      <section aria-labelledby="achievement-list-title">
        <h2 id="achievement-list-title">게임별 업적</h2>
        <div id="achievement-list" class="achievements-grid"></div>
      </section>
      <p class="quiet">Classic 업적은 계정 기록의 존재를 뜻합니다. 점수의 진위나 완주를 인증하는 표시는 아닙니다.</p>
      <a class="secondary" href="/profile">나의 게임으로 이동 →</a>
    </div>
  </main>
  <footer class="footer">INHAGAME · 게임 기록과 랭킹은 각 게임에서 관리합니다.</footer>
</body>
</html>
