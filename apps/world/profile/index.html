<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d2739">
  <title>내 프로필 · INHAGAME</title>
  <link rel="stylesheet" href="/hub.css">
  <link rel="stylesheet" href="/profile/profile.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script defer src="/hub-telemetry.js"></script>
  <script defer src="/api/public-supabase-config"></script>
  <script defer src="/profile/profile.js"></script>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="/">INHA<span>GAME</span> 🦆</a>
      <a class="profile-back" href="/">← 게임 허브</a>
    </div>
  </header>
  <main class="main profile-main">
    <span class="tag">INHAGAME ID · P1</span>
    <h1>내 프로필</h1>
    <p class="lead">내 게임 활동과 대표 기록을 한곳에서 확인해요.</p>
    <p id="profile-status" role="status" aria-live="polite">계정 상태를 확인하는 중…</p>
    <div id="profile-login" class="card" hidden>
      <h2>로그인이 필요해요</h2>
      <p>허브에서 기존 INHAGAME 계정으로 로그인해 주세요.</p>
      <a class="primary" href="/#account">허브에서 로그인 →</a>
    </div>
    <div id="profile-content" hidden>
      <section class="card profile-header">
        <div class="profile-avatar" id="profile-avatar" aria-label="인덕 아바타">🦆</div>
        <div>
          <div class="profile-heading"><h2 id="profile-nickname"></h2><span id="profile-badge" class="badge" hidden>인하대 인증 ✓</span></div>
          <p id="profile-department"></p>
          <p id="profile-title" class="quiet"></p>
          <p id="profile-summary"></p>
          <button id="edit-open" class="secondary" type="button">프로필 편집</button>
        </div>
      </section>
      <section id="profile-edit" class="card profile-edit" hidden>
        <h2>프로필 편집</h2>
        <form id="profile-edit-form">
          <label class="profile-field">닉네임<input name="nickname" maxlength="12" minlength="2" pattern="[0-9A-Za-z가-힣_ ]{2,12}" required></label>
          <label class="profile-field">학과<select name="department"><option value="">학과 미선택</option></select></label>
          <label class="profile-field">칭호<input name="title" maxlength="40" placeholder="원하는 칭호를 입력하세요"></label>
          <fieldset class="avatar-options"><legend>인덕 아바타</legend>
            <label><input type="radio" name="avatar" value="classic">🦆 기본 인덕</label>
            <label><input type="radio" name="avatar" value="scholar">📚 공부 인덕</label>
            <label><input type="radio" name="avatar" value="explorer">🧭 탐험 인덕</label>
            <label><input type="radio" name="avatar" value="star">⭐ 별빛 인덕</label>
          </fieldset>
          <button class="primary" type="submit">저장</button>
          <button class="secondary" type="button" id="edit-cancel">취소</button>
        </form>
        <p id="edit-status" role="status"></p>
      </section>
      <section class="card profile-achievement" aria-labelledby="profile-achievement-heading">
        <h2 id="profile-achievement-heading">나의 업적</h2>
        <p id="profile-achievement-status" role="status" aria-live="polite">업적을 불러오는 중…</p>
        <div id="profile-achievement-result" hidden>
          <strong id="profile-achievement-count"></strong>
          <h3 id="profile-achievement-title" hidden></h3>
          <p id="profile-achievement-description" hidden></p>
          <p id="profile-achievement-date" class="quiet" hidden></p>
          <p id="profile-achievement-empty" hidden>아직 획득한 업적이 없어요.</p>
        </div>
        <button id="profile-achievement-retry" class="secondary" type="button" hidden>다시 시도</button>
        <a class="secondary" href="/achievements">전체 업적 보기 →</a>
      </section>
      <section aria-labelledby="games-heading">
        <h2 id="games-heading">나의 게임</h2>
        <div id="profile-games" class="profile-games"></div>
      </section>
      <section class="card profile-meta">
        <h2>계정 정보</h2>
        <p>가입일 <strong id="profile-joined"></strong></p>
        <p>인하대 인증 <strong id="profile-verified"></strong></p>
      </section>
    </div>
  </main>
  <footer class="footer">INHAGAME · 게임별 기록과 랭킹은 각 게임에서 관리합니다.</footer>
</body>
</html>
