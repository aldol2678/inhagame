<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>인하 메일 인증 | INHAGAME</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#f1f7fc;color:#17384e;margin:0;min-height:100vh;display:grid;place-items:center}
main{background:white;border:1px solid #d4e4f0;border-radius:18px;padding:28px;max-width:460px;margin:20px;box-shadow:0 12px 30px #1234}
h1{font-size:23px}p{line-height:1.65}a{color:#005bac}small{color:#526b7c}
</style>
</head>
<body>
<main>
<h1>🎓 인하 메일 인증</h1>
<p id="status" role="status">인증 결과를 확인하고 있어요...</p>
<p><a href="/">게임으로 돌아가기</a></p>
<small>메일 주소 소유 확인 뱃지이며 재학·졸업·학교 공식 인증을 뜻하지 않습니다.</small>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
<script>
(async () => {
  const status = document.getElementById('status');
  const token = new URLSearchParams(location.hash.slice(1)).get('access_token');
  history.replaceState(null, '', location.pathname);
  if (!token) {
    status.textContent = '인증 링크가 유효하지 않아요. 계정 화면에서 다시 요청해 주세요.';
    return;
  }
  if (!window.supabase) {
    status.textContent = '인증 서비스를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.';
    return;
  }
  try {
    // Never import the school-mail session into the game account's stored session.
    const client = window.supabase.createClient(
      ((globalThis.__INHAGAME_PUBLIC_SUPABASE__||{}).url),
      ((globalThis.__INHAGAME_PUBLIC_SUPABASE__||{}).publishableKey),
      { auth: { detectSessionInUrl: false, persistSession: true } },
    );
    const { data: { session }, error } = await client.auth.getSession();
    if (error || !session || session.user.is_anonymous) {
      status.textContent = '기존 INHAGAME 계정 로그인이 필요해요. 이 브라우저에서 로그인한 뒤 인증 메일을 다시 요청해 주세요.';
      return;
    }
    const response = await fetch('' + ((globalThis.__INHAGAME_PUBLIC_SUPABASE__||{}).url) + '/functions/v1/verify-inha-mail', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': ((globalThis.__INHAGAME_PUBLIC_SUPABASE__||{}).publishableKey),
        'Authorization': 'Bearer ' + session.access_token,
      },
      body: JSON.stringify({ school_access_token: token }),
    });
    const result = await response.json();
    status.textContent = response.ok && result.verified
      ? '인하 메일 인증 완료! 게임으로 돌아가면 🎓 인하 메일 인증 뱃지가 표시돼요.'
      : result.error === 'EMAIL_ALREADY_LINKED'
        ? '이 학교 메일은 이미 다른 계정의 뱃지 인증에 사용됐어요.'
        : '인증을 완료하지 못했어요. 계정에서 새 인증 메일을 요청해 주세요.';
  } catch (error) {
    status.textContent = '연결에 실패했어요. 계정에서 인증 메일을 다시 요청해 주세요.';
  }
})();
</script>
</body>
</html>
